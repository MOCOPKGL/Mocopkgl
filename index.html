ription": "Normal scramble. No special rule."}, {"name": "Junior Putting", "description": "Play a normal scramble until the ball reaches the green. Once on the green, only the child may putt."}, {"name": "Scramble", "description": "Normal scramble. No special rule."}, {"name": "Junior Drive", "description": "Same Junior Drive rule as Hole 2."}, {"name": "Scramble", "description": "Normal scramble. No special rule."}, {"name": "Junior Second Shot", "description": "The child hits the team’s second shot with two attempts. If neither qualifying shot travels 15 yards, the parent plays Stroke 3 and scramble resumes."}, {"name": "Alternate Shot", "description": "The child tees off with two attempts. If neither travels at least 15 yards, the parent tees off as Stroke 2. Alternate shot continues until holed."}]}}, "schedule": [{"month": "August", "course": "Needwood", "matchups": [{"teamA": "Say Vadelay", "teamB": "Czech's Mates"}, {"teamA": "The Fossil Clan", "teamB": "Basilio Bombers"}, {"teamA": "Colombian Crushers", "teamB": "Scaggs to the Flags"}, {"teamA": "Rippen from the Rough", "teamB": "Rip Tides"}, {"teamA": "The Gophers", "teamB": "The Smails"}, {"teamA": "Pancake Putters", "teamB": "Spackler"}]}, {"month": "September", "course": "Northwest", "matchups": [{"teamA": "Say Vadelay", "teamB": "The Fossil Clan"}, {"teamA": "Czech's Mates", "teamB": "Rip Tides"}, {"teamA": "Colombian Crushers", "teamB": "Pancake Putters"}, {"teamA": "Rippen from the Rough", "teamB": "The Gophers"}, {"teamA": "Scaggs to the Flags", "teamB": "Basilio Bombers"}, {"teamA": "Spackler", "teamB": "The Smails"}]}, {"month": "October", "course": "Willow Springs", "matchups": [{"teamA": "Say Vadelay", "teamB": "Colombian Crushers"}, {"teamA": "Czech's Mates", "teamB": "The Smails"}, {"teamA": "The Fossil Clan", "teamB": "Scaggs to the Flags"}, {"teamA": "Rippen from the Rough", "teamB": "Spackler"}, {"teamA": "The Gophers", "teamB": "Rip Tides"}, {"teamA": "Pancake Putters", "teamB": "Basilio Bombers"}]}, {"month": "November", "course": "Needwood", "matchups": [{"teamA": "Say Vadelay", "teamB": "Rippen from the Rough"}, {"teamA": "Czech's Mates", "teamB": "Colombian Crushers"}, {"teamA": "The Fossil Clan", "teamB": "The Gophers"}, {"teamA": "Pancake Putters", "teamB": "The Smails"}, {"teamA": "Scaggs to the Flags", "teamB": "Spackler"}, {"teamA": "Rip Tides", "teamB": "Basilio Bombers"}]}, {"month": "December", "course": "Northwest", "matchups": [{"teamA": "Say Vadelay", "teamB": "The Gophers"}, {"teamA": "Czech's Mates", "teamB": "Scaggs to the Flags"}, {"teamA": "The Fossil Clan", "teamB": "The Smails"}, {"teamA": "Colombian Crushers", "teamB": "Rippen from the Rough"}, {"teamA": "Pancake Putters", "teamB": "Rip Tides"}, {"teamA": "Spackler", "teamB": "Basilio Bombers"}]}, {"month": "January", "course": "Willow Springs", "matchups": [{"teamA": "Say Vadelay", "teamB": "Pancake Putters"}, {"teamA": "Czech's Mates", "teamB": "The Fossil Clan"}, {"teamA": "Colombian Crushers", "teamB": "The Smails"}, {"teamA": "Rippen from the Rough", "teamB": "Scaggs to the Flags"}, {"teamA": "The Gophers", "teamB": "Basilio Bombers"}, {"teamA": "Rip Tides", "teamB": "Spackler"}]}, {"month": "February", "course": "Needwood", "matchups": [{"teamA": "Say Vadelay", "teamB": "Scaggs to the Flags"}, {"teamA": "Czech's Mates", "teamB": "Basilio Bombers"}, {"teamA": "The Fossil Clan", "teamB": "Rippen from the Rough"}, {"teamA": "Colombian Crushers", "teamB": "Spackler"}, {"teamA": "The Gophers", "teamB": "Pancake Putters"}, {"teamA": "Rip Tides", "teamB": "The Smails"}]}, {"month": "March", "course": "Northwest", "matchups": [{"teamA": "Say Vadelay", "teamB": "Rip Tides"}, {"teamA": "Czech's Mates", "teamB": "Rippen from the Rough"}, {"teamA": "The Fossil Clan", "teamB": "Colombian Crushers"}, {"teamA": "The Gophers", "teamB": "Spackler"}, {"teamA": "Pancake Putters", "teamB": "Scaggs to the Flags"}, {"teamA": "The Smails", "teamB": "Basilio Bombers"}]}], "adminPin": "7315"};
const KEY='moco_pkgl_v7';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{config:DEFAULT_CONFIG,results:{},user:null};
let deferredPrompt=null;
const C=()=>state.config,$=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function team(n){return C().teams.find(t=>t.nickname===n)}
function course(n){return C().courses[n]}
function mid(mi,xi){return `m${mi}-x${xi}`}
function isAdmin(){return !!state.user?.admin}
function canEditMatch(x){return isAdmin()||state.user?.team===x.teamA}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function attr(s){return esc(s).replace(/"/g,'&quot;')}
function init(){
 $('#teamSelect').innerHTML=C().teams.map(t=>`<option>${t.nickname} (${t.players})</option>`).join('');
 if(state.user)enter();
}
function login(){const t=C().teams[$('#teamSelect').selectedIndex],pin=$('#pinInput').value.trim();if(!t||pin!==t.pin)return alert('Incorrect team PIN.');state.user={team:t.nickname,admin:false};save();enter()}
function enter(){$('#login').classList.add('hidden');$('#nav').classList.remove('hidden');renderInstall();tab('schedule')}
$('#logout').onclick=()=>{state.user=null;save();location.reload()}
$$('nav button[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function tab(n){['schedule','scorecard','standings','stats','rules','admin'].forEach(x=>$('#'+x).classList.add('hidden'));$('#'+n).classList.remove('hidden');$$('nav button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===n));if(n==='schedule')renderSchedule();if(n==='standings')renderStandings();if(n==='stats')renderStats();if(n==='rules')renderRules();if(n==='admin')renderAdmin()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;renderInstall()});
async function installApp(){if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;renderInstall()}else alert('On iPhone: open this site in Safari, tap Share, then choose “Add to Home Screen.”')}
function renderInstall(){if(!state.user)return;$('#install').classList.remove('hidden');$('#install').innerHTML=`<div class="card install-card"><div><strong>Install MOCO PKGL on your phone</strong><div class="tiny">Open it from your Home Screen like a regular app.</div></div><button class="gold" onclick="installApp()">Install app</button></div>`}
function renderSchedule(){$('#schedule').innerHTML=`<div class="card"><h2>Season Schedule</h2><div class="muted">The first-listed team enters the score. The opponent reviews it.</div></div><div class="grid">${C().schedule.map((m,mi)=>{const cr=course(m.course),done=m.matchups.filter((_,xi)=>state.results[mid(mi,xi)]?.final).length;return `<div class="card event" onclick="showMonth(${mi})"><div class="event-top"><div class="course-mark">${cr.short}</div><div><h3>${m.month}</h3><div class="muted">${m.course}</div></div></div><div class="event-bottom"><strong>${done}/${m.matchups.length} matches complete</strong><div class="tiny" style="margin-top:5px">Tap to view matchups</div></div></div>`}).join('')}</div>`}
function label(n){const t=team(n);return `<div class="team-name">${n}</div><div class="muted">${t?t.players:''}</div>`}
function showMonth(mi){const m=C().schedule[mi],cr=course(m.course),own=state.user?.team;$('#schedule').innerHTML=`<div class="card"><button class="secondary" onclick="renderSchedule()">← All months</button><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:12px"><div><h2>${m.month} — ${m.course}</h2><div class="muted">Par ${cr.pars.reduce((a,b)=>a+b,0)}</div></div><a class="gold" style="text-decoration:none" target="_blank" rel="noopener" href="${cr.maps}">Directions</a></div></div><div class="card">${m.matchups.map((x,xi)=>{const r=state.results[mid(mi,xi)],inMatch=x.teamA===own||x.teamB===own,editable=canEditMatch(x);return `<div class="match"><div>${label(x.teamA)}<div class="vs">VS.</div>${label(x.teamB)}<div class="muted" style="margin-top:6px">${r?.final?`${r.totalA}–${r.totalB} · Final`:'Not submitted'}</div></div><button class="${inMatch?'primary':'secondary'}" ${inMatch?`onclick="openCard(${mi},${xi})"`:'disabled'}>${r?.final?'View':editable?'Enter score':'Review'}</button></div>`}).join('')}</div>`}
function ensure(k){if(!state.results[k])state.results[k]={scoresA:Array(9).fill(''),scoresB:Array(9).fill(''),final:false};return state.results[k]}
function openCard(mi,xi){const m=C().schedule[mi],cr=course(m.course),x=m.matchups[xi],k=mid(mi,xi),r=ensure(k),editable=canEditMatch(x)&&(!r.final||isAdmin());$('#schedule').classList.add('hidden');$('#scorecard').classList.remove('hidden');const status=r.final&&!isAdmin()?'Final score is locked. The administrator can correct it.':editable?`${x.teamA} is responsible for entering both teams’ scores.`:`${x.teamA} enters the score. You may review this scorecard.`;$('#scorecard').innerHTML=`<div class="card"><button class="secondary" onclick="back(${mi})">← Back</button><h2 style="margin-top:12px">${m.month} — ${m.course}</h2><div class="muted">${x.teamA} vs. ${x.teamB}</div><div class="notice">${status}</div></div><div class="card"><div class="score-head"><div>Hole</div><div>Par</div><div>${x.teamA}</div><div>${x.teamB}</div></div>${cr.pars.map((p,i)=>`<div class="rulebox"><strong>Hole ${i+1}: ${esc(cr.rules[i].name)}</strong>${esc(cr.rules[i].description)}</div><div class="score-row"><strong>${i+1}</strong><div>${p}</div><input inputmode="numeric" value="${r.scoresA[i]}" ${editable?'':'disabled'} oninput="put('${k}','A',${i},this,${p})"><input inputmode="numeric" value="${r.scoresB[i]}" ${editable?'':'disabled'} oninput="put('${k}','B',${i},this,${p})"></div>`).join('')}<div id="totals"></div>${editable?`<div class="actions"><button class="primary" onclick="finalize('${k}',${mi},${xi})">${r.final?'Update final score':'Submit final score'}</button><button class="secondary" onclick="saveDraft()">Save draft</button></div>`:''}${r.final?`<div class="share-result"><button class="gold" onclick="shareResult(${mi},${xi})">Share result</button></div>`:''}</div>`;totals(k,mi,xi)}
function back(mi){$('#scorecard').classList.add('hidden');$('#schedule').classList.remove('hidden');showMonth(mi)}
function put(k,s,i,el,p){let v=el.value.replace(/\D/g,'');if(v!==''){v=Math.max(1,Math.min(p+2,+v));el.value=v}const r=ensure(k);r[s==='A'?'scoresA':'scoresB'][i]=v;r.final=false;const n=k.match(/\d+/g).map(Number);totals(k,n[0],n[1]);save()}
function calc(a,pars){const n=a.map(v=>v===''?null:+v),complete=n.every(v=>v!==null),total=n.reduce((s,v)=>s+(v||0),0),played=n.filter(v=>v!==null).length,parPlayed=pars.slice(0,played).reduce((a,b)=>a+b,0);return{complete,total,toPar:total-parPlayed}}
function pt(n){return n===0?'E':n>0?`+${n}`:`${n}`}
function totals(k,mi,xi){const m=C().schedule[mi],pars=course(m.course).pars,x=m.matchups[xi],r=ensure(k),a=calc(r.scoresA,pars),b=calc(r.scoresB,pars);r.totalA=a.total;r.totalB=b.total;let w='Enter all scores to determine the winner.';if(a.complete&&b.complete)w=a.total===b.total?'Match tied':`${a.total<b.total?x.teamA:x.teamB} wins by ${Math.abs(a.total-b.total)}`;$('#totals').innerHTML=`<div class="summary"><div class="total"><div class="muted">${x.teamA}</div><div class="big">${a.total||'—'}</div><div>${pt(a.toPar)}</div></div><div class="total"><div class="muted">${x.teamB}</div><div class="big">${b.total||'—'}</div><div>${pt(b.toPar)}</div></div></div><div class="winner">${w}</div>`}
function saveDraft(){save();alert('Draft saved on this device.')}
function finalize(k,mi,xi){const m=C().schedule[mi],pars=course(m.course).pars,r=ensure(k),a=calc(r.scoresA,pars),b=calc(r.scoresB,pars);if(!a.complete||!b.complete)return alert('Enter a score for every hole for both teams.');r.final=true;r.totalA=a.total;r.totalB=b.total;save();alert('Final score submitted and locked.');back(mi)}
async function shareResult(mi,xi){const m=C().schedule[mi],x=m.matchups[xi],r=state.results[mid(mi,xi)],winner=r.totalA===r.totalB?'Match tied':`${r.totalA<r.totalB?x.teamA:x.teamB} won`;const text=`MOCO PKGL — ${m.month} at ${m.course}\n${x.teamA} ${r.totalA} — ${r.totalB} ${x.teamB}\n${winner}`;if(navigator.share){try{await navigator.share({title:'MOCO PKGL Result',text})}catch(e){}}else{await navigator.clipboard.writeText(text);alert('Result copied. Paste it into a text or email.')}}
function standingsData(){const s={};C().teams.forEach(t=>s[t.nickname]={W:0,L:0,T:0,Pts:0,Diff:0,Played:0});C().schedule.forEach((m,mi)=>m.matchups.forEach((x,xi)=>{const r=state.results[mid(mi,xi)];if(!r?.final)return;const a=s[x.teamA],b=s[x.teamB];a.Played++;b.Played++;a.Diff+=r.totalA-r.totalB;b.Diff+=r.totalB-r.totalA;if(r.totalA<r.totalB){a.W++;b.L++;a.Pts+=3}else if(r.totalB<r.totalA){b.W++;a.L++;b.Pts+=3}else{a.T++;b.T++;a.Pts++;b.Pts++}}));return Object.entries(s).sort((a,b)=>b[1].Pts-a[1].Pts||a[1].Diff-b[1].Diff)}
function renderStandings(){const rows=standingsData();$('#standings').innerHTML=`<div class="card"><h2>League Standings</h2><div class="muted">Win = 3 points · Tie = 1 · Lowest score differential breaks ties</div></div><div class="card" style="overflow:auto"><table><tr><th>#</th><th>Team</th><th>GP</th><th>W</th><th>L</th><th>T</th><th>Pts</th><th>Diff</th></tr>${rows.map(([n,v],i)=>`<tr><td class="rank">${i+1}</td><td>${n}</td><td>${v.Played}</td><td>${v.W}</td><td>${v.L}</td><td>${v.T}</td><td><strong>${v.Pts}</strong></td><td>${v.Diff>0?'+':''}${v.Diff}</td></tr>`).join('')}</table></div>`}
function teamStats(){const s={};C().teams.forEach(t=>s[t.nickname]={rounds:0,strokes:0,par:0,birdies:0,pars:0,bogeys:0,doubles:0});C().schedule.forEach((m,mi)=>m.matchups.forEach((x,xi)=>{const r=state.results[mid(mi,xi)];if(!r?.final)return;const pars=course(m.course).pars;[[x.teamA,r.scoresA],[x.teamB,r.scoresB]].forEach(([name,scores])=>{const z=s[name];z.rounds++;scores.forEach((v,i)=>{v=+v;z.strokes+=v;z.par+=pars[i];const d=v-pars[i];if(d<0)z.birdies++;else if(d===0)z.pars++;else if(d===1)z.bogeys++;else z.doubles++})})}));return s}
function renderStats(){const s=teamStats(),own=state.user?.team||C().teams[0].nickname,v=s[own],avg=v.rounds?(v.strokes/v.rounds).toFixed(1):'—';$('#stats').innerHTML=`<div class="card"><h2>${own} Statistics</h2><div class="muted">Team scoring statistics from submitted league matches.</div></div><div class="card"><div class="stats-grid"><div class="stat"><b>${v.rounds}</b>Rounds</div><div class="stat"><b>${avg}</b>Average</div><div class="stat"><b>${v.rounds?pt(v.strokes-v.par):'—'}</b>Total to par</div><div class="stat"><b>${v.birdies}</b>Birdies or better</div><div class="stat"><b>${v.pars}</b>Pars</div><div class="stat"><b>${v.bogeys}</b>Bogeys</div><div class="stat"><b>${v.doubles}</b>Double bogeys</div></div></div>`}
function renderRules(){$('#rules').innerHTML=`<div class="card"><h2>League Rules</h2><p><strong>Format:</strong> Nine-hole parent-kid scramble using regular stroke scoring.</p><p><strong>Maximum:</strong> Double bogey on every hole.</p><p><strong>Junior attempts:</strong> Except when putting, the child gets two attempts and may choose either shot. Required junior shots must travel at least 15 yards.</p><p><strong>Lie improvement:</strong> Juniors may improve the lie within the same terrain only.</p><p><strong>Adults:</strong> Play the ball as it lies.</p><p><strong>Gallery Rule:</strong> When both teams agree a ball remained in play but cannot be found in plain sight, drop in the agreed area without penalty.</p></div>${Object.keys(C().courses).map(n=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${n}</h2><a class="secondary" style="text-decoration:none" href="${course(n).maps}" target="_blank" rel="noopener">Directions</a></div>${course(n).rules.map((r,i)=>`<div class="rulebox"><strong>Hole ${i+1}: ${esc(r.name)}</strong>${esc(r.description)}</div>`).join('')}</div>`).join('')}`}
function renderAdmin(){if(!isAdmin()){if(prompt('Enter admin PIN:')!==C().adminPin){tab('schedule');return}else{state.user.admin=true;save()}}$('#admin').innerHTML=`<div class="card"><h2>Administrator Dashboard</h2><div class="muted">Edit schedules, course pars, course rules and submitted scores.</div></div><div class="card"><h3>Schedule</h3><select id="adminMonth" onchange="adminMonth(this.value)">${C().schedule.map((m,i)=>`<option value="${i}">${m.month} — ${m.course}</option>`).join('')}</select></div><div id="adminSchedule"></div><div class="card"><h3>Course Manager</h3><div class="course-tabs">${Object.keys(C().courses).map((n,i)=>`<button class="${i===0?'active':''}" onclick="adminCourse('${n}',this)">${n}</button>`).join('')}</div><div id="courseEditor"></div></div><div class="card"><div class="actions"><button class="secondary" onclick="exportData()">Export backup</button><button class="secondary" onclick="document.getElementById('imp').click()">Import backup</button><input id="imp" class="hidden" type="file" accept=".json" onchange="importData(this.files[0])"><button class="danger" onclick="resetAll()">Reset app</button></div></div>`;adminMonth(0);adminCourse(Object.keys(C().courses)[0],document.querySelector('.course-tabs button'))}
function opts(sel){return C().teams.map(t=>`<option ${t.nickname===sel?'selected':''}>${t.nickname}</option>`).join('')}
function adminMonth(mi){mi=+mi;const m=C().schedule[mi];$('#adminSchedule').innerHTML=`<div class="card"><h3>${m.month} Matchups</h3>${m.matchups.map((x,xi)=>`<div class="adminmatch"><select onchange="changeTeam(${mi},${xi},'teamA',this.value)">${opts(x.teamA)}</select><select onchange="changeTeam(${mi},${xi},'teamB',this.value)">${opts(x.teamB)}</select><div class="actions" style="margin:0"><button class="secondary" onclick="adminOpenMatch(${mi},${xi})">Open score</button><button class="danger" onclick="deleteMatch(${mi},${xi})">Delete</button></div></div>`).join('')}<button class="primary" onclick="addMatch(${mi})">Add matchup</button></div>`}
function adminCourse(name,btn){document.querySelectorAll('.course-tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');const cr=course(name);$('#courseEditor').innerHTML=`<h3>${name}</h3>${cr.rules.map((r,i)=>`<div class="rule-editor"><div class="two-col"><label>Hole ${i+1} par<input inputmode="numeric" value="${cr.pars[i]}" onchange="changeCoursePar('${name}',${i},this.value)"></label><label>Rule name<input value="${attr(r.name)}" onchange="changeRule('${name}',${i},'name',this.value)"></label></div><label style="display:block;margin-top:8px">Rule description<textarea onchange="changeRule('${name}',${i},'description',this.value)">${esc(r.description)}</textarea></label></div>`).join('')}`}
function changeTeam(mi,xi,k,v){C().schedule[mi].matchups[xi][k]=v;save()}
function addMatch(mi){C().schedule[mi].matchups.push({teamA:C().teams[0].nickname,teamB:C().teams[1].nickname});save();adminMonth(mi)}
function deleteMatch(mi,xi){if(confirm('Delete this matchup?')){C().schedule[mi].matchups.splice(xi,1);save();adminMonth(mi)}}
function adminOpenMatch(mi,xi){openCard(mi,xi)}
function changeCoursePar(name,i,v){course(name).pars[i]=Math.max(3,Math.min(6,+v||3));save()}
function changeRule(name,i,k,v){course(name).rules[i][k]=v;save()}
function exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='moco-pkgl-backup.json';a.click()}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();alert('Backup imported.');tab('schedule')}catch{alert('Invalid backup file.')}};r.readAsText(f)}
function resetAll(){if(confirm('Reset all scores, schedule changes and rule changes?')){localStorage.removeItem(KEY);location.reload()}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script>
</body></html>

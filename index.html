<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d2b"><title>MOCO PKGL Scorekeeper</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--g:#123d2b;--g2:#1c6948;--gold:#d4a73b;--cream:#f5f1e8;--ink:#172019;--line:#d7ddd8;--muted:#6c756f}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--ink)}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:14px;position:sticky;top:0;z-index:10}
.brand{max-width:960px;margin:auto;display:flex;align-items:center;gap:11px}.logo{width:48px;height:48px;border:3px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:900}
h1{font-size:1.15rem;margin:0}.sub{font-size:.78rem;opacity:.83;margin-top:2px}
nav{position:sticky;top:76px;z-index:9;background:#fff;border-bottom:1px solid var(--line);padding:8px 10px;display:flex;gap:7px;overflow:auto}
nav button{border:0;border-radius:999px;padding:9px 13px;font-weight:800;background:#edf1ee;white-space:nowrap}nav button.active{background:var(--g);color:#fff}
main{max-width:960px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:13px;box-shadow:0 7px 20px #1020160b}
h2,h3{margin:0 0 9px}.muted{color:var(--muted);font-size:.88rem}.badge{display:inline-block;background:#e5f0e9;color:var(--g);border-radius:999px;padding:4px 9px;font-size:.75rem;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.month{cursor:pointer}
.match{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.match:first-child{border-top:0}
button{cursor:pointer}.primary,.secondary,.danger{border:0;border-radius:11px;padding:10px 13px;font-weight:800}.primary{background:var(--g);color:#fff}.secondary{background:#edf1ee}.danger{background:#fae8e8;color:#8b2929}
.hidden{display:none!important}.login{max-width:430px;margin:28px auto}.notice{background:#fff6db;border:1px solid #e8d28e;border-radius:12px;padding:10px;font-size:.84rem;margin-top:12px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccd4ce;border-radius:10px;background:#fff;margin-top:5px;font:inherit}
textarea{min-height:90px;resize:vertical}
.rulebox{background:#edf5ef;border-left:5px solid var(--g);padding:11px;border-radius:10px;margin:10px 0}.rulebox strong{display:block;margin-bottom:3px}
.score-head,.score-row{display:grid;grid-template-columns:40px 44px 1fr 1fr;gap:6px;align-items:center}.score-head{font-size:.7rem;color:var(--muted);text-transform:uppercase}.score-row{padding:8px 0;border-top:1px solid var(--line)}
.score-row input{text-align:center;font-size:1.15rem;margin:0}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.total{background:#eff5f1;border-radius:13px;padding:11px;text-align:center}.big{font-size:1.75rem;font-weight:900}
.winner{margin-top:10px;background:#e4f3e9;color:var(--g);border-radius:13px;padding:11px;text-align:center;font-weight:900}
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}
.adminmatch{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin:8px 0}.sectiontitle{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.course-tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.course-tabs button{border:0;border-radius:999px;padding:9px 12px;font-weight:800;background:#edf1ee;white-space:nowrap}.course-tabs button.active{background:var(--g);color:#fff}
.rule-editor{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fbfcfb}
.two-col{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:end}
footer{text-align:center;color:var(--muted);padding:22px;font-size:.8rem}
@media(max-width:560px){.sub{display:none}nav{top:76px}.adminmatch,.two-col{grid-template-columns:1fr}.score-head,.score-row{grid-template-columns:35px 40px 1fr 1fr}}
</style>
</head>
<body>

<section id="schedule" class="hidden"></section><section id="scorecard" class="hidden"></section><section id="standings" class="hidden"></section><section id="rules" class="hidden"></section><section id="admin" class="hidden"></section>
</main><footer>Stroke play · Maximum score: double bogey · Lowest total wins</footer>

"Par 3. The child tees off with two attempts. If neither travels at least 15 yards, the parent tees off as Stroke 2. Alternate shot continues until holed."}]}, "Northwest": {"pars": [4, 4, 3, 4, 5, 3, 4, 4, 5], "rules": [{"name": "Scramble", "description": "Normal scramble. No special rule."}, {"name": "Junior Drive", "description": "The child tees off with two attempts. A drive of at least 15 yards must be used. If neither travels 15 yards, the parent tees off as Stroke 2."}, {"name": "Scramble", "description": "Normal scramble. No special rule."}, {"name": "Junior Putting", "description": "Play a normal scramble until the ball reaches the green. Once on the green, only the child may putt."}, {"name": "Scramble", "description": "Normal scramble. No special rule."}, {"name": "Junior Drive", "description": "Same Junior Drive rule as Hole 2. No Stableford bonus is awarded."}, {"name": "Scramble", "description": "Normal scramble. No special rule."}, {"name": "Junior Second Shot", "description": "The child hits the team’s second shot with two attempts. The selected shot must travel at least 15 yards. If neither qualifies, the parent plays Stroke 3 and scramble resumes."}, {"name": "Alternate Shot", "description": "Par 3. The child tees off with two attempts. If neither travels at least 15 yards, the parent tees off as Stroke 2. Alternate shot continues until holed."}]}, "Willow Springs": {"pars": [3, 3, 3, 4, 4, 3, 3, 4, 4], "rules": [{"name": "Scramble", "description": "Normal scramble. No special rule."}, {"name": "Junior Drive", "description": "The child tees off with two attempts. A drive of at least 15 yards must be used. If neither travels 15 yards, the parent tees off as Stroke 2."}, {"name": "Scramble", "description": "Normal scramble. No special rule."}, {"name": "Junior Putting", "description": "Play a normal scramble until the ball reaches the green. Once on the green, only the child may putt."}, {"name": "Scramble", "description": "Normal scramble. No special rule."}, {"name": "Junior Drive", "description": "Same Junior Drive rule as Hole 2. No Stableford bonus is awarded."}, {"name": "Scramble", "description": "Normal scramble. No special rule."}, {"name": "Junior Second Shot", "description": "The child hits the team’s second shot with two attempts. The selected shot must travel at least 15 yards. If neither qualifies, the parent plays Stroke 3 and scramble resumes."}, {"name": "Alternate Shot", "description": "Par 3. The child tees off with two attempts. If neither travels at least 15 yards, the parent tees off as Stroke 2. Alternate shot continues until holed."}]}}, "schedule": [{"month": "August", "course": "Needwood", "matchups": [{"teamA": "Say Vadelay", "teamB": "Czech's Mates"}, {"teamA": "The Fossil Clan", "teamB": "Basilio Bombers"}, {"teamA": "Colombian Crushers", "teamB": "Scaggs to the Flags"}, {"teamA": "Rippen from the Rough", "teamB": "Rip Tides"}, {"teamA": "The Gophers", "teamB": "The Smails"}, {"teamA": "Pancake Putters", "teamB": "Spackler"}]}, {"month": "September", "course": "Northwest", "matchups": [{"teamA": "Say Vadelay", "teamB": "The Fossil Clan"}, {"teamA": "Czech's Mates", "teamB": "Rip Tides"}, {"teamA": "Colombian Crushers", "teamB": "Pancake Putters"}, {"teamA": "Rippen from the Rough", "teamB": "The Gophers"}, {"teamA": "Scaggs to the Flags", "teamB": "Basilio Bombers"}, {"teamA": "Spackler", "teamB": "The Smails"}]}, {"month": "October", "course": "Willow Springs", "matchups": [{"teamA": "Say Vadelay", "teamB": "Colombian Crushers"}, {"teamA": "Czech's Mates", "teamB": "The Smails"}, {"teamA": "The Fossil Clan", "teamB": "Scaggs to the Flags"}, {"teamA": "Rippen from the Rough", "teamB": "Spackler"}, {"teamA": "The Gophers", "teamB": "Rip Tides"}, {"teamA": "Pancake Putters", "teamB": "Basilio Bombers"}]}, {"month": "November", "course": "Needwood", "matchups": [{"teamA": "Say Vadelay", "teamB": "Rippen from the Rough"}, {"teamA": "Czech's Mates", "teamB": "Colombian Crushers"}, {"teamA": "The Fossil Clan", "teamB": "The Gophers"}, {"teamA": "Pancake Putters", "teamB": "The Smails"}, {"teamA": "Scaggs to the Flags", "teamB": "Spackler"}, {"teamA": "Rip Tides", "teamB": "Basilio Bombers"}]}, {"month": "December", "course": "Northwest", "matchups": [{"teamA": "Say Vadelay", "teamB": "The Gophers"}, {"teamA": "Czech's Mates", "teamB": "Scaggs to the Flags"}, {"teamA": "The Fossil Clan", "teamB": "The Smails"}, {"teamA": "Colombian Crushers", "teamB": "Rippen from the Rough"}, {"teamA": "Pancake Putters", "teamB": "Rip Tides"}, {"teamA": "Spackler", "teamB": "Basilio Bombers"}]}, {"month": "January", "course": "Willow Springs", "matchups": [{"teamA": "Say Vadelay", "teamB": "Pancake Putters"}, {"teamA": "Czech's Mates", "teamB": "The Fossil Clan"}, {"teamA": "Colombian Crushers", "teamB": "The Smails"}, {"teamA": "Rippen from the Rough", "teamB": "Scaggs to the Flags"}, {"teamA": "The Gophers", "teamB": "Basilio Bombers"}, {"teamA": "Rip Tides", "teamB": "Spackler"}]}, {"month": "February", "course": "Needwood", "matchups": [{"teamA": "Say Vadelay", "teamB": "Scaggs to the Flags"}, {"teamA": "Czech's Mates", "teamB": "Basilio Bombers"}, {"teamA": "The Fossil Clan", "teamB": "Rippen from the Rough"}, {"teamA": "Colombian Crushers", "teamB": "Spackler"}, {"teamA": "The Gophers", "teamB": "Pancake Putters"}, {"teamA": "Rip Tides", "teamB": "The Smails"}]}, {"month": "March", "course": "Northwest", "matchups": [{"teamA": "Say Vadelay", "teamB": "Rip Tides"}, {"teamA": "Czech's Mates", "teamB": "Rippen from the Rough"}, {"teamA": "The Fossil Clan", "teamB": "Colombian Crushers"}, {"teamA": "The Gophers", "teamB": "Spackler"}, {"teamA": "Pancake Putters", "teamB": "Scaggs to the Flags"}, {"teamA": "The Smails", "teamB": "Basilio Bombers"}]}], "adminPin": "7315"};
const KEY='moco_pkgl_v6';
let saved=JSON.parse(localStorage.getItem(KEY)||'null');
let state=saved||{config:DEFAULT_CONFIG,results:{},user:null};
const C=()=>state.config, $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function mid(mi,xi){return `m${mi}-x${xi}`}
function team(n){return C().teams.find(t=>t.nickname===n)}
function course(name){return C().courses[name]}
function isAdmin(){return !!state.user?.admin}
function canEditMatch(x){return isAdmin() || state.user?.team===x.teamA}
function init(){ $('#teamSelect').innerHTML=C().teams.map(t=>`<option>${t.nickname} (${t.players})</option>`).join(''); if(state.user)enter() }
function login(){const idx=$('#teamSelect').selectedIndex,t=C().teams[idx],pin=$('#pinInput').value.trim();if(!t||pin!==t.pin)return alert('Incorrect team PIN.');state.user={team:t.nickname,admin:false};save();enter()}
function enter(){$('#login').classList.add('hidden');$('#nav').classList.remove('hidden');tab('schedule')}
$('#logout').onclick=()=>{state.user=null;save();location.reload()}
$$('nav button[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function tab(n){['schedule','scorecard','standings','rules','admin'].forEach(x=>$('#'+x).classList.add('hidden'));$('#'+n).classList.remove('hidden');$$('nav button[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===n));if(n==='schedule')renderSchedule();if(n==='standings')renderStandings();if(n==='rules')renderRules();if(n==='admin')renderAdmin()}
function renderSchedule(){$('#schedule').innerHTML=`<div class="card"><h2>League Schedule</h2><div class="muted">The first-listed team enters the score. The opponent can review it.</div></div><div class="grid">${C().schedule.map((m,mi)=>`<div class="card month" onclick="showMonth(${mi})"><span class="badge">${m.course}</span><h3 style="margin-top:9px">${m.month}</h3><div class="muted">${m.matchups.filter((_,xi)=>state.results[mid(mi,xi)]?.final).length} of ${m.matchups.length} completed</div></div>`).join('')}</div>`}
function label(n){const t=team(n);return `<strong>${n}</strong><div class="muted">${t?t.players:''}</div>`}
function showMonth(mi){const m=C().schedule[mi],own=state.user?.team;$('#schedule').innerHTML=`<div class="card"><button class="secondary" onclick="renderSchedule()">← All months</button><h2 style="margin-top:12px">${m.month} — ${m.course}</h2></div><div class="card">${m.matchups.map((x,xi)=>{const r=state.results[mid(mi,xi)],inMatch=x.teamA===own||x.teamB===own,editable=canEditMatch(x);return `<div class="match"><div>${label(x.teamA)}<div class="muted" style="margin:4px 0">vs.</div>${label(x.teamB)}<div class="muted" style="margin-top:5px">${r?.final?`${r.totalA}–${r.totalB} Final`:'Open'}</div></div><button class="${inMatch?'primary':'secondary'}" ${inMatch?`onclick="openCard(${mi},${xi})"`:'disabled'}>${r?.final?'View Score':editable?'Enter Score':'View Only'}</button></div>`}).join('')}</div>`}
function ensure(k){if(!state.results[k])state.results[k]={scoresA:Array(9).fill(''),scoresB:Array(9).fill(''),final:false};return state.results[k]}
function openCard(mi,xi){const m=C().schedule[mi],crs=course(m.course),x=m.matchups[xi],k=mid(mi,xi),r=ensure(k),editable=canEditMatch(x)&&(!r.final||isAdmin());$('#schedule').classList.add('hidden');$('#scorecard').classList.remove('hidden');const status=r.final&&!isAdmin()?'Final score is locked. Only the administrator can edit it.':editable?`${x.teamA} is responsible for entering and submitting this scorecard.`:`${x.teamA} is responsible for entering this scorecard. You can review it here.`;$('#scorecard').innerHTML=`<div class="card"><button class="secondary" onclick="back(${mi})">← Back</button><h2 style="margin-top:12px">${m.month} — ${m.course}</h2><div class="muted">${x.teamA} vs. ${x.teamB}</div><div class="notice">${status}</div></div><div class="card"><div class="score-head"><div>Hole</div><div>Par</div><div>${x.teamA}</div><div>${x.teamB}</div></div>${crs.pars.map((p,i)=>`<div class="rulebox"><strong>Hole ${i+1}: ${crs.rules[i].name}</strong>${crs.rules[i].description}</div><div class="score-row"><strong>${i+1}</strong><div>${p}</div><input inputmode="numeric" value="${r.scoresA[i]}" ${editable?'': 'disabled'} oninput="put('${k}','A',${i},this,${p})"><input inputmode="numeric" value="${r.scoresB[i]}" ${editable?'': 'disabled'} oninput="put('${k}','B',${i},this,${p})"></div>`).join('')}<div id="totals"></div>${editable?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="primary" onclick="finalize('${k}',${mi},${xi})">${r.final?'Update final score':'Submit final score'}</button><button class="secondary" onclick="saveDraft()">Save draft</button></div>`:''}</div>`;totals(k,mi,xi)}
function back(mi){$('#scorecard').classList.add('hidden');$('#schedule').classList.remove('hidden');showMonth(mi)}
function put(k,s,i,el,p){let v=el.value.replace(/\D/g,'');if(v!==''){v=Math.max(1,Math.min(p+2,+v));el.value=v}const r=ensure(k);r[s==='A'?'scoresA':'scoresB'][i]=v;r.final=false;const n=k.match(/\d+/g).map(Number);totals(k,n[0],n[1]);save()}
function calc(a,pars){const n=a.map(v=>v===''?null:+v),complete=n.every(v=>v!==null),total=n.reduce((s,v)=>s+(v||0),0),pp=n.reduce((s,v,i)=>s+(v===null?0:pars[i]),0);return{complete,total,toPar:total-pp}}
function pt(n){return n===0?'E':n>0?`+${n}`:`${n}`}
function totals(k,mi,xi){const m=C().schedule[mi],pars=course(m.course).pars,x=m.matchups[xi],r=ensure(k),a=calc(r.scoresA,pars),b=calc(r.scoresB,pars);r.totalA=a.total;r.totalB=b.total;let w='Enter all scores to determine the winner.';if(a.complete&&b.complete)w=a.total===b.total?'Match tied':`${a.total<b.total?x.teamA:x.teamB} wins by ${Math.abs(a.total-b.total)}`;$('#totals').innerHTML=`<div class="summary"><div class="total"><div class="muted">${x.teamA}</div><div class="big">${a.total||'—'}</div><div>${pt(a.toPar)}</div></div><div class="total"><div class="muted">${x.teamB}</div><div class="big">${b.total||'—'}</div><div>${pt(b.toPar)}</div></div></div><div class="winner">${w}</div>`}
function saveDraft(){save();alert('Draft saved on this device.')}
function finalize(k,mi,xi){const m=C().schedule[mi],pars=course(m.course).pars,r=ensure(k),a=calc(r.scoresA,pars),b=calc(r.scoresB,pars);if(!a.complete||!b.complete)return alert('Enter a score for every hole for both teams.');r.final=true;r.totalA=a.total;r.totalB=b.total;save();alert('Final score saved.');back(mi)}
function renderStandings(){const s={};C().teams.forEach(t=>s[t.nickname]={W:0,L:0,T:0,Pts:0,Diff:0});C().schedule.forEach((m,mi)=>m.matchups.forEach((x,xi)=>{const r=state.results[mid(mi,xi)];if(!r?.final)return;const a=s[x.teamA],b=s[x.teamB];a.Diff+=r.totalA-r.totalB;b.Diff+=r.totalB-r.totalA;if(r.totalA<r.totalB){a.W++;b.L++;a.Pts+=3}else if(r.totalB<r.totalA){b.W++;a.L++;b.Pts+=3}else{a.T++;b.T++;a.Pts++;b.Pts++}}));const rows=Object.entries(s).sort((a,b)=>b[1].Pts-a[1].Pts||a[1].Diff-b[1].Diff);$('#standings').innerHTML=`<div class="card"><h2>Standings</h2><div class="muted">Win = 3 · Tie = 1 · Loss = 0</div></div><div class="card" style="overflow:auto"><table><tr><th>Team</th><th>W</th><th>L</th><th>T</th><th>Pts</th><th>Diff</th></tr>${rows.map(([n,v])=>`<tr><td>${n}</td><td>${v.W}</td><td>${v.L}</td><td>${v.T}</td><td><strong>${v.Pts}</strong></td><td>${v.Diff>0?'+':''}${v.Diff}</td></tr>`).join('')}</table></div>`}
function renderRules(){const names=Object.keys(C().courses);$('#rules').innerHTML=`<div class="card"><h2>League Rules</h2><p><strong>Format:</strong> 9-hole parent-kid scramble using regular stroke scoring.</p><p><strong>Maximum score:</strong> Double bogey on every hole.</p><p><strong>Junior attempts:</strong> Except when putting, the child gets two attempts and may select either shot. A required junior shot must travel at least 15 yards.</p><p><strong>Junior lie improvement:</strong> Children may improve the lie within the same terrain only.</p><p><strong>Adults:</strong> Play the ball as it lies.</p><p><strong>Gallery Rule:</strong> If both teams agree a ball remained in play but cannot be found in plain sight, it may be dropped in the agreed area without penalty.</p></div>${names.map(n=>`<div class="card"><h2>${n} Rules</h2>${course(n).rules.map((r,i)=>`<div class="rulebox"><strong>Hole ${i+1}: ${r.name}</strong>${r.description}</div>`).join('')}</div>`).join('')}`}
function renderAdmin(){if(!isAdmin()){if(prompt('Enter admin PIN:')!==C().adminPin){tab('schedule');return}else{state.user.admin=true;save()}}$('#admin').innerHTML=`<div class="card"><h2>Admin</h2><p class="muted">Edit the schedule, hole pars, and the rule name and description for every course.</p></div><div class="card"><h3>Schedule</h3><label>Month</label><select id="adminMonth" onchange="adminMonth(this.value)">${C().schedule.map((m,i)=>`<option value="${i}">${m.month} — ${m.course}</option>`).join('')}</select></div><div id="adminSchedule"></div><div class="card"><h3>Course Manager</h3><div class="course-tabs">${Object.keys(C().courses).map((n,i)=>`<button class="${i===0?'active':''}" onclick="adminCourse('${n}',this)">${n}</button>`).join('')}</div><div id="courseEditor"></div></div><div class="card"><button class="secondary" onclick="exportData()">Export data</button> <button class="secondary" onclick="document.getElementById('imp').click()">Import data</button><input id="imp" class="hidden" type="file" accept=".json" onchange="importData(this.files[0])"><button class="danger" onclick="resetAll()">Reset app</button></div>`;adminMonth(0);adminCourse(Object.keys(C().courses)[0],document.querySelector('.course-tabs button'))}
function opts(sel){return C().teams.map(t=>`<option ${t.nickname===sel?'selected':''}>${t.nickname}</option>`).join('')}
function adminMonth(mi){mi=+mi;const m=C().schedule[mi];$('#adminSchedule').innerHTML=`<div class="card"><h3>${m.month} Matchups</h3>${m.matchups.map((x,xi)=>`<div class="adminmatch"><select onchange="changeTeam(${mi},${xi},'teamA',this.value)">${opts(x.teamA)}</select><select onchange="changeTeam(${mi},${xi},'teamB',this.value)">${opts(x.teamB)}</select><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="secondary" onclick="adminOpenMatch(${mi},${xi})">Open score</button><button class="danger" onclick="deleteMatch(${mi},${xi})">Delete</button></div></div>`).join('')}<button class="primary" onclick="addMatch(${mi})">Add matchup</button></div>`}
function adminCourse(name,btn){document.querySelectorAll('.course-tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');const crs=course(name);$('#courseEditor').innerHTML=`<h3>${name}</h3>${crs.rules.map((r,i)=>`<div class="rule-editor"><div class="two-col"><label>Hole ${i+1} Par<input inputmode="numeric" value="${crs.pars[i]}" onchange="changeCoursePar('${name}',${i},this.value)"></label><label>Rule name<input type="text" value="${escapeAttr(r.name)}" onchange="changeRule('${name}',${i},'name',this.value)"></label></div><label style="display:block;margin-top:8px">Rule description<textarea onchange="changeRule('${name}',${i},'description',this.value)">${escapeHtml(r.description)}</textarea></label></div>`).join('')}`}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escapeAttr(s){return escapeHtml(s).replace(/"/g,'&quot;')}
function changeTeam(mi,xi,k,v){C().schedule[mi].matchups[xi][k]=v;save()}
function adminOpenMatch(mi,xi){openCard(mi,xi)}
function addMatch(mi){C().schedule[mi].matchups.push({teamA:C().teams[0].nickname,teamB:C().teams[1].nickname});save();adminMonth(mi)}
function deleteMatch(mi,xi){if(confirm('Delete this matchup?')){C().schedule[mi].matchups.splice(xi,1);save();adminMonth(mi)}}
function changeCoursePar(name,i,v){course(name).pars[i]=Math.max(3,Math.min(6,+v||3));save()}
function changeRule(name,i,k,v){course(name).rules[i][k]=v;save()}
function exportData(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='moco-pkgl-v4-data.json';a.click()}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();alert('Data imported.');tab('schedule')}catch{alert('Invalid file.')}};r.readAsText(f)}
function resetAll(){if(confirm('Reset all scores, schedule edits, and course-rule changes?')){localStorage.removeItem(KEY);location.reload()}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script></body></html>

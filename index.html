<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d71920">
<link rel="manifest" href="manifest.webmanifest">
<title>PKGA | Parent Kid Golf Association</title>

<style>
:root{
  --red:#d71920;
  --red2:#a90f15;
  --black:#111214;
  --black2:#1a1c20;
  --panel:#ffffff;
  --bg:#eef0f3;
  --ink:#15171a;
  --muted:#6b7078;
  --line:#d7dbe0;
  --soft:#f5f6f8;
  --gold:#d4a72c;
  --danger:#9d2e2e;
  --green:#123d2b;
  --green2:#1f6848;
  --cream:#f6f3e8
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.35}
header{background:linear-gradient(90deg,#0c0d0f 0%,#17191d 68%,#24262b 100%);color:#fff;border-bottom:5px solid var(--red);box-shadow:0 3px 12px #0004;padding:0}
header .wrap{max-width:1180px;margin:auto;padding:18px 16px 16px;position:relative}
header .wrap:before{content:"PKGL";display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:900;letter-spacing:1.4px;padding:5px 8px;margin-bottom:7px}
h1{font-size:30px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.4px;font-weight:900}
header p{margin:6px 0 0;color:#c7cbd1;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}
main{max-width:1180px;margin:auto;padding:0 14px 32px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:18px;margin:14px 0;box-shadow:0 1px 4px #00000014}
.card h2{margin:0 0 12px;padding-bottom:10px;border-bottom:3px solid var(--red);font-size:21px;text-transform:uppercase;letter-spacing:.25px}
.card h3{text-transform:uppercase;font-size:15px;letter-spacing:.35px}
.hidden{display:none!important}
label{font-size:12px;font-weight:900;color:#51565e;text-transform:uppercase;letter-spacing:.5px}
input,select,button,textarea{font:inherit}
input,select,textarea{border-radius:2px;border:1px solid #bfc4ca;padding:11px;background:#fff}
input,select{width:100%;margin:6px 0 12px}
button{border:0;border-radius:2px;background:#22252a;color:#fff;font-weight:900;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;padding:11px 14px}
button:hover{background:#000}
button.secondary{background:#e4e7eb;color:#202328}
button.secondary:hover{background:#d5d9de}
button.gold{background:var(--gold);color:#181818}
button.danger{background:var(--danger)}
button:disabled{opacity:.5;cursor:not-allowed}
.nav{display:flex;gap:0;flex-wrap:wrap;position:sticky;top:0;z-index:20;background:#17191d;border-bottom:1px solid #2b2e34;margin:0 -14px 14px;padding:0 14px}
.nav button{border-radius:0;background:transparent;padding:14px 12px;border-bottom:4px solid transparent;font-size:12px}
.nav button:hover{background:#22252a;border-bottom-color:var(--red)}
.nav button.gold{background:#282b31;color:#f2c94c}
.nav button.secondary{background:transparent;color:#d9dde2}
.nav .spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}
.event{cursor:pointer;border-top:5px solid #22252a;transition:transform .12s ease,box-shadow .12s ease}
.event:hover{transform:translateY(-2px);box-shadow:0 5px 16px #0002}
.event h2{margin:8px 0 5px;border:0;padding:0;font-size:22px}
.pill{display:inline-block;background:var(--red);color:#fff;border-radius:2px;padding:5px 8px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.55px}
.muted{color:var(--muted);font-size:12px}
.match{border-top:1px solid var(--line);padding:16px 0}
.match:first-child{border-top:0}
.teams{font-size:18px;font-weight:900;letter-spacing:.05px}
.result{font-size:25px;font-weight:900;margin:8px 0;font-variant-numeric:tabular-nums}
.rule{background:#f2f3f5;border-left:5px solid var(--red);padding:11px 12px;margin:12px 0 6px;border-radius:0}
.score{display:grid;grid-template-columns:52px 62px 1fr 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.score input{text-align:center;margin:0;font-weight:900;font-size:16px}
.score-head{background:#1b1d21;color:#fff;padding:10px 8px;font-size:11px;font-weight:900;text-transform:uppercase}
.total{font-size:21px;font-weight:900;line-height:1.6;background:#f1f3f5;border-left:5px solid var(--red);padding:10px 12px;margin-top:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
thead{background:#1b1d21;color:#fff}
th{text-transform:uppercase;letter-spacing:.35px;font-size:11px}
th,td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:center}
tbody tr:nth-child(even){background:#f6f7f8}
tbody tr:hover{background:#fff3f3}
th:nth-child(2),td:nth-child(2){text-align:left}
.status{padding:10px;border-radius:2px;margin-top:10px}
.ok{background:#e7f5e9;color:#185c26}
.error{background:#f9e8e8;color:#8d2525}
.banner{background:#f3f4f6;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:0;padding:11px 12px;margin:10px 0}
.refresh{font-size:11px}
.playoff-card{border:1px solid var(--line);border-top:4px solid var(--red);border-radius:2px;padding:15px;margin:12px 0;background:#fff}
.playoff-row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.playoff-pct{font-size:24px;font-weight:900;color:var(--red)}
.playoff-vs{text-align:center;font-weight:900;padding:9px 0;color:#747980;font-size:11px;letter-spacing:1px}
#who.banner{background:#fff;border-left-color:#202328;font-size:12px;text-transform:uppercase;font-weight:800}
#login{max-width:520px;margin:28px auto;border-top:5px solid var(--red)}
#login h2{font-size:19px}
a{color:#b40f15;font-weight:800}
@media(max-width:650px){
  header .wrap{padding:15px 14px}
  h1{font-size:24px}
  .nav{overflow-x:auto;flex-wrap:nowrap;white-space:nowrap}
  .nav .spacer{display:none}
  .nav button{flex:0 0 auto}
  .score{grid-template-columns:42px 52px 1fr 1fr}
  .card{padding:14px}
  th,td{font-size:11px;padding:8px 4px}
  .teams{font-size:16px}
  .result{font-size:22px}
}

/* PKGA Maryland identity */
:root{--md-red:#d71920;--md-gold:#ffcd00;--md-black:#111111;--md-white:#ffffff}
.site-header .wrap:before{content:"MARYLAND • PKGA";background:var(--md-red);color:#fff}
.site-header{background:linear-gradient(100deg,#050505 0%,#161616 58%,#2a090a 100%);border-bottom-color:var(--md-gold)}
.brand-lockup{display:flex;align-items:center;gap:14px}
.brand-logo{width:78px;height:78px;object-fit:contain;background:#fff;border-radius:50%;box-shadow:0 0 0 3px var(--md-gold),0 0 0 6px var(--md-red)}
.brand-copy h1{font-size:27px}
.brand-copy .sub{color:#e5e5e5;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-top:5px}
.md-ribbon{height:8px;background:linear-gradient(90deg,#111 0 22%,#ffcd00 22% 44%,#d71920 44% 66%,#fff 66% 78%,#d71920 78% 100%)}
.landing{min-height:100vh;background:#080808;color:#fff;display:grid;place-items:center;position:relative;overflow:hidden;padding:28px 18px}
.landing:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 15%,#d7192040,transparent 35%),radial-gradient(circle at 85% 80%,#ffcd0028,transparent 34%),linear-gradient(135deg,#090909,#161616 55%,#050505)}
.landing-shell{width:min(980px,100%);position:relative;z-index:2;text-align:center;border:1px solid #ffffff20;background:#0b0b0bd9;box-shadow:0 30px 80px #0008;padding:26px 24px 0}
.landing-logo{width:min(300px,66vw);height:auto;filter:drop-shadow(0 15px 30px #0008)}
.landing-kicker{margin-top:12px;color:var(--md-gold);font-weight:900;text-transform:uppercase;letter-spacing:2px;font-size:12px}
.landing-title{margin:6px auto 8px;font-size:clamp(28px,5vw,52px);line-height:1;text-transform:uppercase;max-width:780px}
.landing-copy{max-width:650px;margin:0 auto 20px;color:#d6d6d6}
.enter-btn{background:var(--md-red);border:2px solid var(--md-gold);color:#fff;font-size:18px;letter-spacing:2px;padding:14px 42px;box-shadow:0 8px 0 #8d0c11;margin:5px 0 24px}
.enter-btn:hover{background:#ef2028}
.md-symbols{display:flex;justify-content:center;align-items:center;gap:18px;margin:14px 0 18px;flex-wrap:wrap}
.md-crab{font-size:40px;filter:drop-shadow(0 5px 8px #000)}
.md-flag-mini{width:92px;height:54px;border:2px solid #fff;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden}
.md-flag-mini span:nth-child(1),.md-flag-mini span:nth-child(4){background:conic-gradient(#111 0 25%,#ffcd00 0 50%,#111 0 75%,#ffcd00 0)}
.md-flag-mini span:nth-child(2),.md-flag-mini span:nth-child(3){background:linear-gradient(45deg,#d71920 0 37%,#fff 37% 45%,#d71920 45% 55%,#fff 55% 63%,#d71920 63%)}
.md-map{width:130px;height:64px}
.md-map path{fill:var(--md-gold);stroke:#fff;stroke-width:3}
.tee-scene{height:185px;position:relative;margin:0 -24px;background:linear-gradient(#0d0d0d00,#0d0d0d 70%),linear-gradient(90deg,#d719201f,#ffcd0012);overflow:hidden}
.tee-scene svg{width:100%;height:100%}
.tee-ground{fill:#131313}.tee-golfer{fill:#fff}.tee-accent{fill:var(--md-gold)}.tee-red{fill:var(--md-red)}
.auth-modal{position:fixed;inset:0;background:#000b;z-index:100;display:grid;place-items:center;padding:20px}
.auth-card{width:min(480px,100%);background:#fff;color:#111;border-top:7px solid var(--md-red);box-shadow:0 25px 70px #0008;padding:20px;position:relative}
.auth-card h2{margin:0 0 8px;text-transform:uppercase}
.auth-close{position:absolute;right:10px;top:10px;background:#eee;color:#111;padding:7px 10px}
.protected-note{background:#fff5d4;border-left:5px solid var(--md-gold);padding:10px;margin-bottom:14px;font-size:13px}
.access-bar{background:#fff;border:1px solid var(--line);border-left:5px solid var(--md-gold);padding:9px 12px;margin:12px 0;font-size:12px;font-weight:800;text-transform:uppercase}
.home-hero{position:relative;background:linear-gradient(115deg,#0c0c0c 0 58%,#3b090b 58%);color:#fff;overflow:hidden;border-top:7px solid var(--md-gold)}
.home-hero-inner{position:relative;z-index:2;max-width:620px}
.home-hero h2{border:0;color:#fff;font-size:clamp(28px,5vw,48px);line-height:1;margin:0 0 10px;padding:0}
.home-hero p{color:#ddd;max-width:560px}
.home-hero .tee-mini{position:absolute;right:0;bottom:0;width:42%;height:100%;opacity:.95}
.quick-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.quick-card{background:#fff;border-top:5px solid var(--md-red);padding:14px;cursor:pointer;box-shadow:0 1px 4px #0002}
.quick-card.locked{border-top-color:var(--md-gold)}
.quick-card b{display:block;text-transform:uppercase;font-size:13px;margin-bottom:3px}
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#333;margin-top:15px}
.stat-box{background:#171717;color:#fff;padding:13px;text-align:center}
.stat-box strong{display:block;font-size:24px;color:var(--md-gold)}
.nav{border-bottom:4px solid var(--md-gold)}
.nav button:hover{border-bottom-color:var(--md-red)}
.nav button:nth-child(3),.nav button:nth-child(4){color:#fff}
#logoutBtn{color:#ffcd00}
@media(max-width:720px){
  .brand-logo{width:62px;height:62px}
  .brand-copy h1{font-size:20px}
  .quick-grid{grid-template-columns:1fr 1fr}
  .home-hero{background:#111}
  .home-hero .tee-mini{opacity:.18;width:70%}
  .landing-shell{padding:20px 15px 0}
  .tee-scene{margin:0 -15px}
}


/* PKGA clean entry + season dashboard */

.landing:before{display:none}
.landing-simple{width:min(660px,100%);padding:28px 24px 34px;background:#0b0b0bf2;border:1px solid #ffffff26}
.landing-simple .landing-logo{width:min(330px,72vw);margin-top:20px}
.landing-simple .landing-title{margin:18px auto 28px;font-size:clamp(30px,5vw,46px)}
.landing-simple .enter-btn{margin:0;background:#d71920;border:2px solid #ffcd00;min-width:180px}
.dashboard-intro{display:flex;align-items:center;gap:16px}
.dashboard-intro img{width:96px;height:96px;object-fit:contain}
.dashboard-intro h2{border:0;padding:0;margin:0;font-size:27px}
.dashboard-intro .md-label{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:#d71920;margin-top:5px}
.season-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}

.season-stat strong{display:block;font-size:30px;color:#ffcd00;line-height:1;margin-bottom:8px}

.totm-card{background:#fff;border:1px solid var(--line);border-left:6px solid #d71920;padding:14px}
.totm-card .month{font-size:11px;font-weight:900;text-transform:uppercase;color:#6b7078;letter-spacing:.6px}
.totm-card .winner{font-size:18px;font-weight:900;margin-top:3px}

</style>
</head>


<body>

<section id="landing" class="landing">
  <div class="landing-shell landing-simple">
    <div class="md-ribbon"></div>
    <img src="pkga-logo.webp" class="landing-logo" alt="PKGA Parent Kid Golf Association logo">
    <h1 class="landing-title">Parent Kid Golf Association</h1>
    <button class="enter-btn" onclick="enterSite()">ENTER</button>
  </div>
</section>

<section id="site" class="hidden">
  <header class="site-header">
    <div class="md-ribbon"></div>
    <div class="wrap brand-lockup">
      <img src="pkga-logo.webp" class="brand-logo" alt="PKGA logo">
      <div class="brand-copy">
        <h1>Parent Kid Golf Association</h1>
        <div class="sub">Maryland • League Central • Scores • Standings • Playoffs</div>
      </div>
    </div>
  </header>

  <main>
    <div class="nav">
      <button onclick="showHome()">Home</button>
      <button onclick="openProtected('schedule')">🔒 Schedule</button>
      <button onclick="showStandings()">Standings</button>
      <button onclick="showPlayoffPicture()">Playoff Picture</button>
      <button onclick="openProtected('documents')">🔒 Documents</button>
      <button id="adminTeamsBtn" class="gold hidden" onclick="showTeamManager();return false;">Edit teams</button>
      <button id="adminCoursesBtn" class="gold hidden" onclick="showCourseManager()">Edit courses</button>
      <button id="refreshBtn" class="secondary refresh hidden" onclick="refreshData(true)">Refresh scores</button>
      <span class="spacer"></span>
      <button id="logoutBtn" class="secondary hidden" onclick="logout()">Log out</button>
    </div>
    <div id="who" class="access-bar">Public viewing • Schedule and Documents require a team PIN</div>
    <div id="view"><div class="card">Loading PKGA…</div></div>
  </main>
</section>

<div id="authGate" class="auth-modal hidden">
  <div class="auth-card">
    <button class="auth-close" onclick="closeAuthGate()">✕</button>
    <img src="pkga-logo.webp" alt="PKGA" style="width:86px;height:86px;object-fit:contain;float:right;margin:30px 0 8px 14px">
    <h2 id="authTitle">Team Access</h2>
    <div class="protected-note">Schedule/scoring and Documents are protected. Select your team and enter your 4-digit PIN.</div>
    <label for="team">Team</label>
    <select id="team"></select>
    <label for="pin">4-digit PIN</label>
    <input id="pin" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="Enter PIN">
    <button id="loginBtn" onclick="login()">Unlock</button>
    <div id="msg" class="muted" style="margin-top:10px"></div>
  </div>
</div>

<script src="config.js"></script>

<script>

'use strict';


const U=(window.PKGL_CONFIG&&window.PKGL_CONFIG.SUPABASE_URL)||"https://pnncsskkfmmamuqcilkr.supabase.co";

const K=(window.PKGL_CONFIG&&window.PKGL_CONFIG.SUPABASE_PUBLISHABLE_KEY)||"sb_publishable_2BI4u7jrnH_w6SR1BoIM3Q_vTtz9eHa";


let token=localStorage.getItem('pkgl_token')||'';


let user=null;


try{

  user=JSON.parse(
    localStorage.getItem('pkgl_user')||'null'
  );

}catch(e){

  localStorage.removeItem('pkgl_user');

}


let D=null;
let publicD=null;
let pendingProtected=null;
let currentView={type:'home'};


const $=s=>document.querySelector(s);


const H={
  'apikey':K,
  'Authorization':'Bearer '+K,
  'Content-Type':'application/json'
};


const fallbackTeamNames=[
  "Say Vadelay",
  "Czech's Mates",
  "Spackler",
  "Scaggs to the Flags",
  "Rip Tides",
  "Rippen from the Rough",
  "The Fossil Clan",
  "Colombian Crushers",
  "The Gophers",
  "Pancake Putters",
  "The Smails",
  "Basilio Bombers",
  "League Administrator"
];


async function loadLoginTeams(){

  try{

    const names=
      await rpc(
        'pkgl_public_team_list',
        {}
      );

    $('#team').innerHTML=
      (names||fallbackTeamNames)
      .map(n=>
        `<option>${escapeHtml(n)}</option>`
      )
      .join('');

  }catch{

    $('#team').innerHTML=
      fallbackTeamNames
      .map(n=>
        `<option>${escapeHtml(n)}</option>`
      )
      .join('');

  }

}


loadLoginTeams();


function escapeHtml(s){

  return String(s)
  .replace(
    /[&<>'"]/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );

}


async function rpc(name,body){

  const r=
    await fetch(
      `${U}/rest/v1/rpc/${name}`,
      {
        method:'POST',
        headers:H,
        body:JSON.stringify(body)
      }
    );

  const text=
    await r.text();

  let data=null;


  try{

    data=
      text
      ?JSON.parse(text)
      :null;

  }catch{

    data=text;

  }


  if(!r.ok){

    throw new Error(
      (data&&data.message)
      ||text
      ||`Request failed (${r.status})`
    );

  }


  return data;

}


async function login(){

  const btn=$('#loginBtn');
  $('#msg').className='muted';
  $('#msg').textContent='Signing in…';
  btn.disabled=true;

  try{
    const r=await rpc('pkgl_login',{p_team:$('#team').value,p_pin:$('#pin').value});
    token=r.token;
    user=r;
    localStorage.setItem('pkgl_token',token);
    localStorage.setItem('pkgl_user',JSON.stringify(user));
    await enter();
  }catch(e){
    $('#msg').className='status error';
    $('#msg').textContent=e.message;
  }finally{
    btn.disabled=false;
  }

}


async function enter(){

  await refreshData(false);
  updateAccessUI();
  closeAuthGate();

  const destination=pendingProtected||'schedule';
  pendingProtected=null;

  if(destination==='documents')showDocuments();
  else showSchedule();

}


async function logout(){

  try{await rpc('pkgl_logout',{p_token:token})}catch{}

  token='';
  user=null;
  localStorage.removeItem('pkgl_token');
  localStorage.removeItem('pkgl_user');
  D=publicD;
  updateAccessUI();
  showHome();

}


async function refreshData(showMessage){

  try{
    D=await rpc('pkgl_bootstrap',{p_token:token});
    if(showMessage){
      renderCurrent();
      alert('Scores refreshed.');
    }
  }catch(e){
    if(/expired|session|token/i.test(e.message)){
      token='';
      user=null;
      localStorage.removeItem('pkgl_token');
      localStorage.removeItem('pkgl_user');
      D=publicD;
      updateAccessUI();
    }
    throw e;
  }

}


const course=
  id=>
  D.courses.find(
    c=>c.id===id
  );


const eventBy=
  id=>
  D.events.find(
    e=>e.id===id
  );


const total=
  a=>
  (a||[])
  .reduce(
    (n,v)=>
    n+(Number(v)||0),
    0
  );


async function loadPublicData(){
  const res=await fetch('/.netlify/functions/public-data',{cache:'no-store'});
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||'Unable to load public league data.');
  publicD=data;
  if(!token||!user)D=publicD;
  return data;
}

async function enterSite(){
  $('#landing').classList.add('hidden');
  $('#site').classList.remove('hidden');
  $('#view').innerHTML='<div class="card">Loading PKGA…</div>';

  try{
    if(!publicD)await loadPublicData();
    if(!D)D=publicD;
    updateAccessUI();
    showHome();
  }catch(e){
    $('#view').innerHTML='<div class="card"><h2>PKGA</h2><div class="status error">'+escapeHtml(e.message)+'</div></div>';

function getMonthlyWinners(data){
  const source=data||D;
  if(!source)return [];

  return (source.events||[]).map(e=>{
    const finals=(source.matches||[]).filter(m=>m.event_id===e.id&&m.status==='final');

    let totalMatches=0;
    if(Array.isArray(source.event_match_counts)){
      const count=source.event_match_counts.find(x=>x.event_id===e.id);
      totalMatches=count?Number(count.total_matches||0):0;
    }else{
      totalMatches=(source.matches||[]).filter(m=>m.event_id===e.id).length;
    }

    if(!finals.length||!totalMatches||finals.length!==totalMatches)return null;

    const teamScores=[];
    finals.forEach(m=>{
      teamScores.push({team:m.home_team,score:total(m.home_scores)});
      teamScores.push({team:m.away_team,score:total(m.away_scores)});
    });

    teamScores.sort((a,b)=>a.score-b.score||String(a.team).localeCompare(String(b.team)));
    const winner=teamScores[0];

    return winner?{
      month:e.month_name,
      team:winner.team,
      score:winner.score
    }:null;
  }).filter(Boolean);
}

function getSeasonStats(data){
  const source=data||D;
  if(!source)return{matches:0,pars:0,birdies:0,hours:0};

  const finals=(source.matches||[]).filter(m=>m.status==='final');
  let pars=0;
  let birdies=0;
  let hours=0;

  finals.forEach(m=>{
    const e=(source.events||[]).find(x=>x.id===m.event_id);
    const c=e?(source.courses||[]).find(x=>x.id===e.course_id):null;
    const holes=(c&&c.holes)||[];

    // Estimate: about 2 hours per 9 holes for each parent-kid team.
    // Each match has two family teams, so a 9-hole match contributes ~4 parent-kid hours.
    hours+=holes.length?(holes.length/9)*4:0;

    holes.forEach((hole,i)=>{
      const hs=Number((m.home_scores||[])[i]);
      const as=Number((m.away_scores||[])[i]);

      [hs,as].forEach(score=>{
        if(!Number.isFinite(score)||score<1)return;
        const diff=score-Number(hole.par);
        if(diff===0)pars++;
        else if(diff===-1)birdies++;
      });
    });
  });

  return{
    matches:finals.length,
    pars,
    birdies,
    hours:Math.round(hours)
  };
}

function showSchedule(){

  if(!token||!user){
    openProtected('schedule');
    return;
  }

  currentView={
    type:'schedule'
  };


  const monthlyWinners=
    D.events
    .map(e=>{

      const ms=
        D.matches
        .filter(m=>
          m.event_id===e.id
          &&
          m.status==='final'
        );


      const all=
        D.matches
        .filter(m=>
          m.event_id===e.id
        );


      if(
        !ms.length
        ||
        ms.length!==all.length
      ){

        return null;

      }


      const scores={};


      ms.forEach(m=>{

        scores[m.home_team]=
          (scores[m.home_team]||0)
          +
          total(
            m.home_scores
          );


        scores[m.away_team]=
          (scores[m.away_team]||0)
          +
          total(
            m.away_scores
          );

      });


      const winner=
        Object.entries(scores)
        .sort(
          (a,b)=>
          a[1]-b[1]
        )[0];


      return winner
      ?{
        month:e.month_name,
        team:winner[0],
        score:winner[1]
      }
      :null;

    })
    .filter(Boolean);


  const winnersHtml=
    monthlyWinners.length

    ?`
      <div class="card">

        <h2>
          🏆 Teams of the Month
        </h2>

        <div class="grid">

          ${
            monthlyWinners
            .map(w=>

                <b>
                  ${escapeHtml(w.month)}
                </b>

                <br>

                ${escapeHtml(w.team)}

                <br>

                <span class="muted">
                  Score: ${w.score}
                </span>

              </div>
              `
            )
            .join('')
          }

        </div>

      </div>
    `

    :'';


  const eventsHtml=
    `
    <div class="grid">

      ${
        D.events
        .map(e=>{

          const c=
            course(
              e.course_id
            );


          const ms=
            D.matches
            .filter(m=>
              m.event_id===e.id
            );


          const done=
            ms
            .filter(m=>
              m.status==='final'
            )
            .length;


          return `
            <div
              class="card event"
              onclick="showEvent('${e.id}')">

              <span class="pill">
                Event ${e.event_order}
              </span>

              <h2>
                ${escapeHtml(e.month_name)}
              </h2>

              <b>
                ${escapeHtml(c.name)}
              </b>

              <p>
                ${done} of ${ms.length}
                matches final
              </p>

              <div class="muted">
                Tap to view matches
              </div>

            </div>
          `;

        })
        .join('')
      }

    </div>
    `;


  $('#view').innerHTML=
    winnersHtml+
    eventsHtml;

function cap(el,par){

  el.value=
    el.value.replace(
      /\D/g,
      ''
    );


  if(
    el.value!==''
  ){

    el.value=
      String(
        Math.max(
          1,
          Math.min(
            par+2,
            Number(el.value)
          )
        )
      );

  }

}


function values(prefix){

  const e=
    eventBy(
      CARD.event_id
    );


  const c=
    course(
      e.course_id
    );


  return Array.from(
    {
      length:
        c.holes.length
    },
    (_,i)=>{

      const v=
        $(
          `#${prefix}${i}`
        )
        .value;


      return v===''
      ?null
      :Number(v);

    }
  );

}

        a.includes(null)

async function saveHole(
  courseId,
  holeNumber
){

  const par=
    Number(
      $(
        `#par-${holeNumber}`
      )
      .value
    );


  const rule=
    $(
      `#rule-${holeNumber}`
    )
    .value
    .trim();


  const desc=
    $(
      `#desc-${holeNumber}`
    )
    .value
    .trim();


  if(
    !Number.isInteger(par)
    ||
    par<2
    ||
    par>7
  ){

    alert(
      'Par must be a whole number from 2 through 7.'
    );

    return;

  }


  if(
    !rule
    ||
    !desc
  ){

    alert(
      'Enter both a rule title and a description.'
    );

    return;

  }


  try{

    await rpc(
      'pkgl_admin_update_hole',
      {
        p_token:token,
        p_course_id:courseId,
        p_hole_number:holeNumber,
        p_par:par,
        p_rule_name:rule,
        p_rule_description:desc
      }
    );


    await refreshData(false);


    alert(
      `Hole ${holeNumber} updated. Everyone will now see the change.`
    );


    showCourseManager(
      courseId
    );


  }catch(e){

    alert(
      e.message
    );

  }

}

async function uploadDocument(){

  const input=
    $('#docFile');


  const file=
    input?.files?.[0];


  if(
    !file
  ){

    alert(
      'Choose a file first.'
    );

    return;

  }


  try{

    const reader=
      new FileReader();


    reader.onload=
      async function(){

        try{

          const fileData=
            reader.result
            .split(',')[1];


          const res=
            await fetch(
              '/.netlify/functions/upload-document',
              {
                method:'POST',
                headers:{
                  'Content-Type':
                    'application/json'
                },
                body:
                  JSON.stringify({
                    token:token,
                    fileName:file.name,
                    fileType:file.type,
                    fileData:fileData
                  })
              }
            );


          const data=
            await res.json();


          if(
            !res.ok
          ){

  }catch(e){

async function saveTeam(id){

  const nickname=
    $(
      `#nick-${id}`
    )
    .value
    .trim();


  const players=
    $(
      `#players-${id}`
    )
    .value
    .trim();


  const pin=
    $(
      `#pin-${id}`
    )
    .value
    .trim();


  if(
    !nickname
    ||
    !players
  ){

    alert(
      'Enter both the team name and the parent/child names.'
    );

    return;

  }


  if(
    pin
    &&
    !/^\d{4}$/.test(pin)
  ){

    alert(
      'The new PIN must contain exactly four numbers.'
    );

    return;

  }


  try{

    await rpc(
      'pkgl_admin_update_team',
      {
        p_token:token,
        p_team_id:id,
        p_nickname:nickname,
        p_players:players,
        p_new_pin:pin||null
      }
    );


    await refreshData(false);


    alert(
      'Team updated. The change is now visible to everyone.'
    );


    showTeamManager();


  }catch(e){

    alert(
      e.message
    );

  }

}


function buildStandings(){

  const s={};


  D.teams.forEach(t=>{

    s[t.id]={
      id:t.id,
      name:t.nickname,
      gp:0,
      w:0,
      l:0,
      t:0,
      pts:0,
      strokes:0,
      cumulative:0,
      birdies:0,
      pars:0,
      bogeys:0,
      doubles:0
    };

  });


  D.matches
  .filter(m=>
    m.status==='final'
  )
  .forEach(m=>{

    const h=
      s[m.home_team_id];


    const a=
      s[m.away_team_id];


    if(
      !h
      ||
      !a
    ){

      return;

    }


    const x=
      total(
        m.home_scores
      );


    const y=
      total(
        m.away_scores
      );


    h.gp++;

    a.gp++;


    h.strokes+=x;

    a.strokes+=y;


    if(
      x<y
    ){

      h.w++;

      a.l++;

      h.pts+=3;

    }

    else if(
      y<x
    ){

      a.w++;

      h.l++;

      a.pts+=3;

    }

    else{

      h.t++;

      a.t++;

      h.pts++;

      a.pts++;

    }


    const e=
      eventBy(
        m.event_id
      );


    const c=
      course(
        e.course_id
      );


    const parTotal=
      (c.holes||[])
      .reduce(
        (n,hole)=>
        n+
        Number(
          hole.par||0
        ),
        0
      );


    h.cumulative+=
      x-parTotal;


    a.cumulative+=
      y-parTotal;


    (c.holes||[])
    .forEach(
      (hole,i)=>{

        const hs=
          Number(
            (m.home_scores||[])[i]
          );


        const as=
          Number(
            (m.away_scores||[])[i]
          );


        const add=
          (row,score)=>{

            if(
              !Number.isFinite(score)
              ||
              score<1
            ){

              return;

            }


            const d=
              score-hole.par;


            if(
              d===-1
            ){

              row.birdies++;

            }

            else if(
              d===0
            ){

              row.pars++;

            }

            else if(
              d===1
            ){

              row.bogeys++;

            }

            else if(
              d===2
            ){

              row.doubles++;

            }

          };


        add(
          h,
          hs
        );


        add(
          a,
          as
        );

      }
    );

  });


  return Object.values(s)
  .sort(
    (a,b)=>
      b.pts-a.pts
      ||
      b.w-a.w
      ||
      a.strokes-b.strokes
      ||
      a.name.localeCompare(
        b.name
      )
  );

}

function teamProjection(teamId){

  const games=
    D.matches

    .filter(m=>
      m.status==='final'
      &&
      (
        m.home_team_id===teamId
        ||
        m.away_team_id===teamId
      )
    )

    .map(m=>{

      const e=
        eventBy(
          m.event_id
        );


      const c=
        course(
          e.course_id
        );


      const holes=
        (c&&c.holes)
        ||[];


      const par=
        holes
        .reduce(
          (n,h)=>
          n+
          Number(
            h.par||0
          ),
          0
        );


      const score=
        m.home_team_id===teamId

        ?total(
          m.home_scores
        )

        :total(
          m.away_scores
        );


      return{

        order:
          Number(
            e.event_order
          )
          ||0,

        diffPerHole:
          holes.length

          ?(
            score-par
          )
          /
          holes.length

          :0

      };

    })

    .sort(
      (a,b)=>
      a.order-b.order
    );


  if(
    !games.length
  ){

    return{
      games:0,
      projected:null
    };

  }


  const average=
    games.reduce(
      (n,g)=>
      n+
      g.diffPerHole,
      0
    )
    /
    games.length;


  const recentGames=
    games.slice(-3);


  const recent=
    recentGames.reduce(
      (n,g)=>
      n+
      g.diffPerHole,
      0
    )
    /
    recentGames.length;


  const rating=
    (average*.65)
    +
    (recent*.35);


  return{

    games:
      games.length,

    projected:
      34+
      (rating*9)

  };

}


function predictMatch(a,b){

  const pa=
    teamProjection(
      a.id
    );


  const pb=
    teamProjection(
      b.id
    );


  if(
    pa.projected===null
    ||
    pb.projected===null
  ){

    return{
      scoreA:'—',
      scoreB:'—',
      winA:50,
      winB:50
    };

  }


  const recordA=
    a.gp
    ?a.pts/(a.gp*3)
    :.5;


  const recordB=
    b.gp
    ?b.pts/(b.gp*3)
    :.5;


  const strengthA=
    pa.projected
    -
    (
      (recordA-.5)
      *
      1.5
    );


  const strengthB=
    pb.projected
    -
    (
      (recordB-.5)
      *
      1.5
    );


  let winA=
    100
    /
    (
      1+
      Math.exp(
        (
          strengthA
          -
          strengthB
        )
        /
        1.8
      )
    );


  winA=
    Math.max(
      15,
      Math.min(
        85,
        winA
      )
    );


  return{

    scoreA:
      Math.round(
        pa.projected
      ),

    scoreB:
      Math.round(
        pb.projected
      ),

    winA:
      Math.round(
        winA
      ),

    winB:
      100-
      Math.round(
        winA
      )

  };

}


function playoffMatch(a,b){

  if(
    !a
    ||
    !b
  ){

    return '';

  }


  const p=
    predictMatch(
      a,
      b
    );


  const favorite=
    p.winA>p.winB

    ?a.name

    :p.winB>p.winA

    ?b.name

    :'Even';


  return `
    <div class="playoff-card">

      <div class="playoff-row">

        <div>

          <b>
            #${a.seed}
            ${escapeHtml(a.name)}
          </b>

          <div class="muted">
            ${a.w}-${a.l}-${a.t}
            ·
            ${a.pts} pts
          </div>

        </div>

        <div class="playoff-pct">
          ${p.winA}%
        </div>

      </div>


      <div class="playoff-vs">
        VS
      </div>


      <div class="playoff-row">

        <div>

          <b>
            #${b.seed}
            ${escapeHtml(b.name)}
          </b>

          <div class="muted">
            ${b.w}-${b.l}-${b.t}
            ·
            ${b.pts} pts
          </div>

        </div>

        <div class="playoff-pct">
          ${p.winB}%
        </div>

      </div>


      <div
        class="banner"
        style="margin-top:14px">

        <b>
          Projected Score:
        </b>

        ${p.scoreA}
        –
        ${p.scoreB}

        <br>

        <span class="muted">
          Favorite:
          ${escapeHtml(favorite)}
        </span>

      </div>

    </div>
  `;

}

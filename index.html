<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d2b">
<link rel="manifest" href="manifest.webmanifest">
<title>PKGL | Parent-Kid Golf League</title>

<style>
:root{
  --red:#d71920;
  --red2:#a90f15;
  --black:#111214;
  --black2:#1a1c20;
  --panel:#ffffff;
  --bg:#eef0f3;
  --ink:#15171a;
  --muted:#6b7078;
  --line:#d7dbe0;
  --soft:#f5f6f8;
  --gold:#d4a72c;
  --danger:#9d2e2e;
  --green:#123d2b;
  --green2:#1f6848;
  --cream:#f6f3e8
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.35}
header{background:linear-gradient(90deg,#0c0d0f 0%,#17191d 68%,#24262b 100%);color:#fff;border-bottom:5px solid var(--red);box-shadow:0 3px 12px #0004;padding:0}
header .wrap{max-width:1180px;margin:auto;padding:18px 16px 16px;position:relative}
header .wrap:before{content:"PKGL";display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:900;letter-spacing:1.4px;padding:5px 8px;margin-bottom:7px}
h1{font-size:30px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.4px;font-weight:900}
header p{margin:6px 0 0;color:#c7cbd1;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}
main{max-width:1180px;margin:auto;padding:0 14px 32px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:18px;margin:14px 0;box-shadow:0 1px 4px #00000014}
.card h2{margin:0 0 12px;padding-bottom:10px;border-bottom:3px solid var(--red);font-size:21px;text-transform:uppercase;letter-spacing:.25px}
.card h3{text-transform:uppercase;font-size:15px;letter-spacing:.35px}
.hidden{display:none!important}
label{font-size:12px;font-weight:900;color:#51565e;text-transform:uppercase;letter-spacing:.5px}
input,select,button,textarea{font:inherit}
input,select,textarea{border-radius:2px;border:1px solid #bfc4ca;padding:11px;background:#fff}
input,select{width:100%;margin:6px 0 12px}
button{border:0;border-radius:2px;background:#22252a;color:#fff;font-weight:900;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;padding:11px 14px}
button:hover{background:#000}
button.secondary{background:#e4e7eb;color:#202328}
button.secondary:hover{background:#d5d9de}
button.gold{background:var(--gold);color:#181818}
button.danger{background:var(--danger)}
button:disabled{opacity:.5;cursor:not-allowed}
.nav{display:flex;gap:0;flex-wrap:wrap;position:sticky;top:0;z-index:20;background:#17191d;border-bottom:1px solid #2b2e34;margin:0 -14px 14px;padding:0 14px}
.nav button{border-radius:0;background:transparent;padding:14px 12px;border-bottom:4px solid transparent;font-size:12px}
.nav button:hover{background:#22252a;border-bottom-color:var(--red)}
.nav button.gold{background:#282b31;color:#f2c94c}
.nav button.secondary{background:transparent;color:#d9dde2}
.nav .spacer{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}
.event{cursor:pointer;border-top:5px solid #22252a;transition:transform .12s ease,box-shadow .12s ease}
.event:hover{transform:translateY(-2px);box-shadow:0 5px 16px #0002}
.event h2{margin:8px 0 5px;border:0;padding:0;font-size:22px}
.pill{display:inline-block;background:var(--red);color:#fff;border-radius:2px;padding:5px 8px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.55px}
.muted{color:var(--muted);font-size:12px}
.match{border-top:1px solid var(--line);padding:16px 0}
.match:first-child{border-top:0}
.teams{font-size:18px;font-weight:900;letter-spacing:.05px}
.result{font-size:25px;font-weight:900;margin:8px 0;font-variant-numeric:tabular-nums}
.rule{background:#f2f3f5;border-left:5px solid var(--red);padding:11px 12px;margin:12px 0 6px;border-radius:0}
.score{display:grid;grid-template-columns:52px 62px 1fr 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.score input{text-align:center;margin:0;font-weight:900;font-size:16px}
.score-head{background:#1b1d21;color:#fff;padding:10px 8px;font-size:11px;font-weight:900;text-transform:uppercase}
.total{font-size:21px;font-weight:900;line-height:1.6;background:#f1f3f5;border-left:5px solid var(--red);padding:10px 12px;margin-top:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
thead{background:#1b1d21;color:#fff}
th{text-transform:uppercase;letter-spacing:.35px;font-size:11px}
th,td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:center}
tbody tr:nth-child(even){background:#f6f7f8}
tbody tr:hover{background:#fff3f3}
th:nth-child(2),td:nth-child(2){text-align:left}
.status{padding:10px;border-radius:2px;margin-top:10px}
.ok{background:#e7f5e9;color:#185c26}
.error{background:#f9e8e8;color:#8d2525}
.banner{background:#f3f4f6;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:0;padding:11px 12px;margin:10px 0}
.refresh{font-size:11px}
.playoff-card{border:1px solid var(--line);border-top:4px solid var(--red);border-radius:2px;padding:15px;margin:12px 0;background:#fff}
.playoff-row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.playoff-pct{font-size:24px;font-weight:900;color:var(--red)}
.playoff-vs{text-align:center;font-weight:900;padding:9px 0;color:#747980;font-size:11px;letter-spacing:1px}
#who.banner{background:#fff;border-left-color:#202328;font-size:12px;text-transform:uppercase;font-weight:800}
#login{max-width:520px;margin:28px auto;border-top:5px solid var(--red)}
#login h2{font-size:19px}
a{color:#b40f15;font-weight:800}
@media(max-width:650px){
  header .wrap{padding:15px 14px}
  h1{font-size:24px}
  .nav{overflow-x:auto;flex-wrap:nowrap;white-space:nowrap}
  .nav .spacer{display:none}
  .nav button{flex:0 0 auto}
  .score{grid-template-columns:42px 52px 1fr 1fr}
  .card{padding:14px}
  th,td{font-size:11px;padding:8px 4px}
  .teams{font-size:16px}
  .result{font-size:22px}
}

/* Read-only guest dashboard */
.guest-enter{
  width:100%;
  margin-top:8px;
  background:#fff!important;
  color:#17191d!important;
  border:2px solid #17191d!important
}
.guest-enter:hover{background:#f2f3f5!important}
.public-snapshot{max-width:980px;margin:14px auto}
.public-snapshot h2{margin-bottom:5px}
.guest-stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.guest-stat{background:#17191d;color:#fff;border-top:5px solid var(--red);padding:16px 12px;text-align:center;min-height:96px}
.guest-stat strong{display:block;font-size:29px;line-height:1;margin-bottom:9px}
.guest-stat span{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.45px;color:#dfe2e6}
.guest-stat.gold{border-top-color:var(--gold)}
.guest-panel{background:#fff;border:1px solid var(--line);border-radius:3px;padding:18px;margin:14px 0;box-shadow:0 1px 4px #00000014}
.guest-panel h2{margin:0 0 12px;padding-bottom:10px;border-bottom:3px solid var(--red);font-size:21px;text-transform:uppercase}
.guest-kicker{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.7px;color:var(--red)}
.guest-note{font-size:11px;color:var(--muted);margin-top:8px}
.guest-team-month{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.guest-month-card{background:#f5f6f8;border-left:5px solid var(--red);padding:12px}
.guest-month-card .month{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--muted)}
.guest-month-card .winner{font-size:17px;font-weight:900;margin-top:3px}
.guest-month-card .score{display:block;border:0;padding:0;margin-top:4px;font-size:12px;color:var(--muted)}
.guest-nav{display:flex;gap:8px;align-items:center;margin:12px 0}
.guest-nav .spacer{flex:1}
.guest-table-wrap{overflow:auto}
#publicStats .loading{padding:14px;text-align:center;color:var(--muted)}
@media(max-width:700px){
  .guest-stat-grid{grid-template-columns:1fr 1fr}
  .guest-stat strong{font-size:25px}
}

</style>
</head>

<body>

<header>
  <div class="wrap">
    <h1>PKGL — Parent-Kid Golf League</h1>
    <p>League Central · Scores · Standings · Playoff Race</p>
  </div>
</header>

<main>

<section id="login" class="card">
  <h2>League Login</h2>

  <label for="team">Team</label>
  <select id="team"></select>

  <label for="pin">4-digit PIN</label>
  <input id="pin" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="Enter PIN">

  <button id="loginBtn" onclick="login()">Open league app</button>
  <button class="guest-enter" onclick="enterGuest()">Enter as Guest</button>

  <div id="msg" class="muted"></div>
</section>

<section id="publicStats" class="public-snapshot">
  <div class="card loading">Loading live league stats…</div>
</section>

<section id="guestApp" class="hidden">
  <div class="guest-nav">
    <button onclick="showGuestHome()">Guest Home</button>
    <span class="spacer"></span>
    <button class="secondary" onclick="exitGuest()">Exit Guest</button>
  </div>
  <div id="guestView"></div>
</section>


<section id="app" class="hidden">

  <div class="nav">

    <button onclick="showSchedule()">Schedule</button>

    <button onclick="showStandings()">Standings</button>

    <button onclick="showPlayoffPicture()">Playoff Picture</button>

    <button onclick="showDocuments()">Documents</button>

    <button
      id="adminTeamsBtn"
      class="gold hidden"
      onclick="showTeamManager();return false;">
      Edit teams
    </button>

    <button
      id="adminCoursesBtn"
      class="gold hidden"
      onclick="showCourseManager()">
      Edit courses
    </button>

    <button
      class="secondary refresh"
      onclick="refreshData(true)">
      Refresh scores
    </button>

    <span class="spacer"></span>

    <button
      class="secondary"
      onclick="logout()">
      Log out
    </button>

  </div>

  <div id="who" class="banner"></div>

  <div id="view"></div>

</section>

</main>


<script src="config.js"></script>

<script>

'use strict';


const U=(window.PKGL_CONFIG&&window.PKGL_CONFIG.SUPABASE_URL)||"https://pnncsskkfmmamuqcilkr.supabase.co";

const K=(window.PKGL_CONFIG&&window.PKGL_CONFIG.SUPABASE_PUBLISHABLE_KEY)||"sb_publishable_2BI4u7jrnH_w6SR1BoIM3Q_vTtz9eHa";


let token=localStorage.getItem('pkgl_token')||'';


let user=null;


try{

  user=JSON.parse(
    localStorage.getItem('pkgl_user')||'null'
  );

}catch(e){

  localStorage.removeItem('pkgl_user');

}


let D=null;
let GUEST=null;
let guestMode=false;

let currentView={
  type:'schedule'
};


const $=s=>document.querySelector(s);


const H={
  'apikey':K,
  'Authorization':'Bearer '+K,
  'Content-Type':'application/json'
};


const fallbackTeamNames=[
  "Say Vadelay",
  "Czech's Mates",
  "Spackler",
  "Scaggs to the Flags",
  "Rip Tides",
  "Rippen from the Rough",
  "The Fossil Clan",
  "Colombian Crushers",
  "The Gophers",
  "Pancake Putters",
  "The Smails",
  "Basilio Bombers",
  "League Administrator"
];


async function loadLoginTeams(){

  try{

    const names=
      await rpc(
        'pkgl_public_team_list',
        {}
      );

    $('#team').innerHTML=
      (names||fallbackTeamNames)
      .map(n=>
        `<option>${escapeHtml(n)}</option>`
      )
      .join('');

  }catch{

    $('#team').innerHTML=
      fallbackTeamNames
      .map(n=>
        `<option>${escapeHtml(n)}</option>`
      )
      .join('');

  }

}


loadLoginTeams();


function escapeHtml(s){

  return String(s)
  .replace(
    /[&<>'"]/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[c])
  );

}


async function rpc(name,body){

  const r=
    await fetch(
      `${U}/rest/v1/rpc/${name}`,
      {
        method:'POST',
        headers:H,
        body:JSON.stringify(body)
      }
    );

  const text=
    await r.text();

  let data=null;


  try{

    data=
      text
      ?JSON.parse(text)
      :null;

  }catch{

    data=text;

  }


  if(!r.ok){

    throw new Error(
      (data&&data.message)
      ||text
      ||`Request failed (${r.status})`
    );

  }


  return data;

}


async function login(){

  const btn=
    $('#loginBtn');

  $('#msg').className=
    'muted';

  $('#msg').textContent=
    'Signing in…';

  btn.disabled=true;


  try{

    const r=
      await rpc(
        'pkgl_login',
        {
          p_team:
            $('#team').value,

          p_pin:
            $('#pin').value
        }
      );


    token=r.token;

    user=r;


    localStorage.setItem(
      'pkgl_token',
      token
    );


    localStorage.setItem(
      'pkgl_user',
      JSON.stringify(user)
    );


    await enter();


  }catch(e){

    $('#msg').className=
      'status error';

    $('#msg').textContent=
      e.message;

  }finally{

    btn.disabled=false;

  }

}


async function enter(){

  await refreshData(false);


  $('#login')
  .classList
  .add('hidden');


  $('#app')
  .classList
  .remove('hidden');


  $('#adminTeamsBtn')
  .classList
  .toggle(
    'hidden',
    !user.is_admin
  );


  $('#adminCoursesBtn')
  .classList
  .toggle(
    'hidden',
    !user.is_admin
  );


  $('#who').innerHTML=
    `Signed in as <b>${escapeHtml(user.team)}</b>${user.is_admin?' — Administrator':''}`;


  showSchedule();

}


async function logout(){

  try{

    await rpc(
      'pkgl_logout',
      {
        p_token:token
      }
    );

  }catch{}


  localStorage.removeItem(
    'pkgl_token'
  );


  localStorage.removeItem(
    'pkgl_user'
  );


  location.reload();

}


async function refreshData(showMessage){

  try{

    D=
      await rpc(
        'pkgl_bootstrap',
        {
          p_token:token
        }
      );


    if(showMessage){

      renderCurrent();

      alert(
        'Scores refreshed.'
      );

    }


  }catch(e){

    if(
      /expired/i
      .test(e.message)
    ){

      localStorage.clear();

      location.reload();

    }else{

      throw e;

    }

  }

}


const course=
  id=>
  D.courses.find(
    c=>c.id===id
  );


const eventBy=
  id=>
  D.events.find(
    e=>e.id===id
  );


const total=
  a=>
  (a||[])
  .reduce(
    (n,v)=>
    n+(Number(v)||0),
    0
  );


async function loadGuestData(){
  const r=await fetch('/.netlify/functions/guest-data',{cache:'no-store'});
  const text=await r.text();
  let data=null;
  try{data=text?JSON.parse(text):null}catch{data=null}
  if(!r.ok||!data)throw new Error((data&&data.error)||'Unable to load guest statistics.');
  GUEST=data;
  renderPublicStats();
  return data;
}

function statCardsHtml(s){
  return `
    <div class="guest-stat-grid">
      <div class="guest-stat"><strong>${s.teams}</strong><span>Teams</span></div>
      <div class="guest-stat gold"><strong>${s.matchesPlayed}</strong><span>Matches Played</span></div>
      <div class="guest-stat"><strong>${s.estimatedHours}</strong><span>Est. Hours With Kids</span></div>
      <div class="guest-stat gold"><strong>${s.holesPlayed}</strong><span>Team Holes Played</span></div>
      <div class="guest-stat"><strong>${s.eagles}</strong><span>Eagles</span></div>
      <div class="guest-stat gold"><strong>${s.birdies}</strong><span>Birdies</span></div>
      <div class="guest-stat"><strong>${s.pars}</strong><span>Pars</span></div>
      <div class="guest-stat gold"><strong>${s.completedMonths}</strong><span>Months Completed</span></div>
    </div>
  `;
}

function teamOfMonthHtml(items){
  if(!items||!items.length){
    return '<div class="muted">Team of the Month appears after every match in that month is final.</div>';
  }

  return `
    <div class="guest-team-month">
      ${items.map(x=>`
        <div class="guest-month-card">
          <div class="month">${escapeHtml(x.month)}</div>
          <div class="winner">${escapeHtml(x.team)}</div>
          <span class="score">Low score: ${x.score}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function guestStandingsHtml(rows){
  return `
    <div class="guest-table-wrap">
      <table>
        <thead>
          <tr><th>#</th><th>Team</th><th>GP</th><th>W</th><th>L</th><th>T</th><th>Pts</th></tr>
        </thead>
        <tbody>
          ${(rows||[]).map((r,i)=>`
            <tr>
              <td>${i+1}</td>
              <td>${escapeHtml(r.name)}</td>
              <td>${r.gp}</td>
              <td>${r.w}</td>
              <td>${r.l}</td>
              <td>${r.t}</td>
              <td><b>${r.pts}</b></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderPublicStats(){
  if(!GUEST)return;
  $('#publicStats').innerHTML=`
    <div class="guest-panel">
      <div class="guest-kicker">Live PKGL Snapshot</div>
      <h2>League by the Numbers</h2>
      ${statCardsHtml(GUEST.stats)}
      <div class="guest-note">Estimated hours use roughly 2 hours per 9 holes for each parent-kid team. Stats update from submitted final scorecards.</div>
    </div>
  `;
}

async function enterGuest(){
  try{
    if(!GUEST)await loadGuestData();
    guestMode=true;
    $('#login').classList.add('hidden');
    $('#publicStats').classList.add('hidden');
    $('#app').classList.add('hidden');
    $('#guestApp').classList.remove('hidden');
    showGuestHome();
  }catch(e){
    $('#msg').className='status error';
    $('#msg').textContent=e.message;
  }
}

function exitGuest(){
  guestMode=false;
  $('#guestApp').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#publicStats').classList.remove('hidden');
  $('#guestView').innerHTML='';
}

function showGuestHome(){
  if(!GUEST)return;
  $('#guestView').innerHTML=`
    <div class="guest-panel">
      <div class="guest-kicker">Parent-Kid Golf League</div>
      <h2>PKGL Guest View</h2>
      <div class="muted">A read-only look at the league. Score entry, schedules, documents, and admin tools remain protected.</div>
      ${statCardsHtml(GUEST.stats)}
      <div class="guest-note">Estimated hours use roughly 2 hours per 9 holes for each parent-kid team.</div>
    </div>

    <div class="guest-panel">
      <h2>🏆 Team of the Month</h2>
      ${teamOfMonthHtml(GUEST.teamOfMonth)}
    </div>

    <div class="guest-panel">
      <h2>Current Standings</h2>
      ${guestStandingsHtml(GUEST.standings)}
    </div>
  `;
}

loadGuestData().catch(()=>{
  $('#publicStats').innerHTML='<div class="card muted">Live guest stats are temporarily unavailable.</div>';
});


function renderCurrent(){

  if(
    currentView.type===
    'event'
  ){

    showEvent(
      currentView.id
    );

  }

  else if(
    currentView.type===
    'card'
  ){

    openCard(
      currentView.id
    );

  }

  else if(
    currentView.type===
    'standings'
  ){

    showStandings();

  }

  else if(
    currentView.type===
    'playoffs'
  ){

    showPlayoffPicture();

  }

  else if(
    currentView.type===
    'teams'
  ){

    showTeamManager();

  }

  else if(
    currentView.type===
    'courses'
  ){

    showCourseManager(
      currentView.id
    );

  }

  else if(
    currentView.type===
    'documents'
  ){

    showDocuments();

  }

  else{

    showSchedule();

  }

}


function showSchedule(){

  currentView={
    type:'schedule'
  };


  const monthlyWinners=
    D.events
    .map(e=>{

      const ms=
        D.matches
        .filter(m=>
          m.event_id===e.id
          &&
          m.status==='final'
        );


      const all=
        D.matches
        .filter(m=>
          m.event_id===e.id
        );


      if(
        !ms.length
        ||
        ms.length!==all.length
      ){

        return null;

      }


      const scores={};


      ms.forEach(m=>{

        scores[m.home_team]=
          (scores[m.home_team]||0)
          +
          total(
            m.home_scores
          );


        scores[m.away_team]=
          (scores[m.away_team]||0)
          +
          total(
            m.away_scores
          );

      });


      const winner=
        Object.entries(scores)
        .sort(
          (a,b)=>
          a[1]-b[1]
        )[0];


      return winner
      ?{
        month:e.month_name,
        team:winner[0],
        score:winner[1]
      }
      :null;

    })
    .filter(Boolean);


  const winnersHtml=
    monthlyWinners.length

    ?`
      <div class="card">

        <h2>
          🏆 Teams of the Month
        </h2>

        <div class="grid">

          ${
            monthlyWinners
            .map(w=>

function showEvent(id){

  currentView={
    type:'event',
    id
  };

  const e=eventBy(id);
  const c=course(e.course_id);
  const ms=D.matches.filter(m=>m.event_id===id);
  const standings=buildStandings();

  $('#view').innerHTML=
    `
    <button
      class="secondary"
      onclick="showSchedule()">

      ← Back

    </button>

    <div class="card">

      <h2>
        ${escapeHtml(e.month_name)}
        —
        ${escapeHtml(c.name)}
      </h2>

      ${
        ms
        .map(m=>{

          const final=m.status==='final';

          const home=
            standings.find(x=>x.id===m.home_team_id);

          const away=
            standings.find(x=>x.id===m.away_team_id);

          let predictionHtml='';

          if(!final && home && away){

            const p=predictMatch(home,away);

            const projectedWinner=
              p.winA>p.winB
              ?home.name
              :p.winB>p.winA
              ?away.name
              :'Even';

            predictionHtml=
              `
              <div class="banner" style="margin-top:10px">

                <b>
                  Projected Winner:
                  ${escapeHtml(projectedWinner)}
                </b>

                <br>

                <span>

                  ${p.scoreA}
                  –
                  ${p.scoreB}
                  ${escapeHtml(away.name)}
                </span>

                <br>

                <span class="muted">
                  Win chance:
                  ${escapeHtml(home.name)} ${p.winA}%
                  ·
                  ${escapeHtml(away.name)} ${p.winB}%
                </span>

              </div>
              `;
          }

          return `
            <div class="match">

              <div class="teams">

                ${escapeHtml(m.home_team)}

                <span class="muted">
                  vs.
                </span>

                ${escapeHtml(m.away_team)}

              </div>

              <div class="result">

                ${
                  final

                  ?`
                    ${total(m.home_scores)}
                    –
                    ${total(m.away_scores)}

                      Final
                    </span>
                  `

function openCard(id){

    eventBy(

function cap(el,par){

  el.value=
    el.value.replace(
      /\D/g,
      ''
    );


  if(
    el.value!==''
  ){

    el.value=
      String(
        Math.max(
          1,
          Math.min(
            par+2,
            Number(el.value)
          )
        )
      );

  }

}


function values(prefix){

  const e=
    eventBy(
      CARD.event_id
    );


  const c=
    course(
      e.course_id
    );


  return Array.from(
    {
      length:
        c.holes.length
    },
    (_,i)=>{

      const v=
        $(
          `#${prefix}${i}`
        )
        .value;


      return v===''
      ?null
      :Number(v);

    }
  );

}

  try{

        a.includes(null)

    await rpc(

async function saveHole(
  courseId,
  holeNumber
){

  const par=
    Number(
      $(
        `#par-${holeNumber}`
      )
      .value
    );


  const rule=
    $(
      `#rule-${holeNumber}`
    )
    .value
    .trim();


  const desc=
    $(
      `#desc-${holeNumber}`
    )
    .value
    .trim();


  if(
    !Number.isInteger(par)
    ||
    par<2
    ||
    par>7
  ){

    alert(
      'Par must be a whole number from 2 through 7.'
    );

    return;

  }


  if(
    !rule
    ||
    !desc
  ){

    alert(
      'Enter both a rule title and a description.'
    );

    return;

  }


  try{

    await rpc(
      'pkgl_admin_update_hole',
      {
        p_token:token,
        p_course_id:courseId,
        p_hole_number:holeNumber,
        p_par:par,
        p_rule_name:rule,
        p_rule_description:desc
      }
    );


    await refreshData(false);


    alert(
      `Hole ${holeNumber} updated. Everyone will now see the change.`
    );


    showCourseManager(
      courseId
    );


  }catch(e){

    alert(
      e.message
    );

  }

}

  try{

      await fetch(
        '/.netlify/functions/delete-document',

          headers:{

              'application/json'
          },
          body:
            JSON.stringify({
              token:token,
              fileName:fileName
            })

    const data=
      await res.json();

async function uploadDocument(){

  const input=
    $('#docFile');


  const file=
    input?.files?.[0];


  if(
    !file
  ){

    alert(
      'Choose a file first.'
    );

    return;

  }


  try{

    const reader=
      new FileReader();


    reader.onload=
      async function(){

        try{

          const fileData=
            reader.result
            .split(',')[1];


          const res=
            await fetch(
              '/.netlify/functions/upload-document',
              {
                method:'POST',
                headers:{
                  'Content-Type':
                    'application/json'
                },
                body:
                  JSON.stringify({
                    token:token,
                    fileName:file.name,
                    fileType:file.type,
                    fileData:fileData
                  })
              }
            );


          const data=
            await res.json();


          if(
            !res.ok
          ){

            throw new Error(
              data.error
              ||
              'Upload failed.'
            );

          }


          alert(
            'Document uploaded.'
          );


          showDocuments();


        }catch(e){

          alert(
            e.message
          );

        }

      };


    reader.readAsDataURL(
      file
    );


  }catch(e){

    alert(
      e.message
    );

  }

}

function buildStandings(){

  const s={};


  D.teams.forEach(t=>{

    s[t.id]={
      id:t.id,
      name:t.nickname,
      gp:0,
      w:0,
      l:0,
      t:0,
      pts:0,
      strokes:0,
      cumulative:0,
      birdies:0,
      pars:0,
      bogeys:0,
      doubles:0
    };

  });


  D.matches
  .filter(m=>
    m.status==='final'
  )
  .forEach(m=>{

    const h=
      s[m.home_team_id];


    const a=
      s[m.away_team_id];


    if(
      !h
      ||
      !a
    ){

      return;

    }


    const x=
      total(
        m.home_scores
      );


    const y=
      total(
        m.away_scores
      );


    h.gp++;

    a.gp++;


    h.strokes+=x;

    a.strokes+=y;


    if(
      x<y
    ){

      h.w++;

      a.l++;

      h.pts+=3;

    }

    else if(
      y<x
    ){

      a.w++;

      h.l++;

      a.pts+=3;

    }

    else{

      h.t++;

      a.t++;

      h.pts++;

      a.pts++;

    }


    const e=
      eventBy(
        m.event_id
      );


    const c=
      course(
        e.course_id
      );


    const parTotal=
      (c.holes||[])
      .reduce(
        (n,hole)=>
        n+
        Number(
          hole.par||0
        ),
        0
      );


    h.cumulative+=
      x-parTotal;


    a.cumulative+=
      y-parTotal;


    (c.holes||[])
    .forEach(
      (hole,i)=>{

        const hs=
          Number(
            (m.home_scores||[])[i]
          );


        const as=
          Number(
            (m.away_scores||[])[i]
          );


        const add=
          (row,score)=>{

            if(
              !Number.isFinite(score)
              ||
              score<1
            ){

              return;

            }


            const d=
              score-hole.par;


            if(
              d===-1
            ){

              row.birdies++;

            }

            else if(
              d===0
            ){

              row.pars++;

            }

            else if(
              d===1
            ){

              row.bogeys++;

            }

            else if(
              d===2
            ){

              row.doubles++;

            }

          };


        add(
          h,
          hs
        );


        add(
          a,
          as
        );

      }
    );

  });


  return Object.values(s)
  .sort(
    (a,b)=>
      b.pts-a.pts
      ||
      b.w-a.w
      ||
      a.strokes-b.strokes
      ||
      a.name.localeCompare(
        b.name
      )
  );

}

                    ${r.bogeys}
                  </td>

                  <td>
                    ${r.doubles}
                  </td>

                </tr>
                `
              )
              .join('')
            }

          </tbody>

        </table>

      </div>

    </div>
    `;

}


function teamProjection(teamId){

  const games=
    D.matches

    .filter(m=>
      m.status==='final'
      &&
      (
        m.home_team_id===teamId
        ||
        m.away_team_id===teamId
      )
    )

    .map(m=>{

      const e=
        eventBy(
          m.event_id
        );


      const c=
        course(
          e.course_id
        );


      const holes=
        (c&&c.holes)
        ||[];


      const par=
        holes
        .reduce(
          (n,h)=>
          n+
          Number(
            h.par||0
          ),
          0
        );


      const score=
        m.home_team_id===teamId

        ?total(
          m.home_scores
        )

        :total(
          m.away_scores
        );


      return{

        order:
          Number(
            e.event_order
          )
          ||0,

        diffPerHole:
          holes.length

          ?(
            score-par
          )
          /
          holes.length

          :0

      };

    })

    .sort(
      (a,b)=>
      a.order-b.order
    );


  if(
    !games.length
  ){

    return{
      games:0,
      projected:null
    };

  }


  const average=
    games.reduce(
      (n,g)=>
      n+
      g.diffPerHole,
      0
    )
    /
    games.length;


  const recentGames=
    games.slice(-3);


  const recent=
    recentGames.reduce(
      (n,g)=>
      n+
      g.diffPerHole,
      0
    )
    /
    recentGames.length;


  const rating=
    (average*.65)
    +
    (recent*.35);


  return{

    games:
      games.length,

    projected:
      34+
      (rating*9)

  };

}


function predictMatch(a,b){

  const pa=
    teamProjection(
      a.id
    );


  const pb=
    teamProjection(
      b.id
    );


  if(
    pa.projected===null
    ||
    pb.projected===null
  ){

    return{
      scoreA:'—',
      scoreB:'—',
      winA:50,
      winB:50
    };

  }


  const recordA=
    a.gp
    ?a.pts/(a.gp*3)
    :.5;


  const recordB=
    b.gp
    ?b.pts/(b.gp*3)
    :.5;


  const strengthA=
    pa.projected
    -
    (
      (recordA-.5)
      *
      1.5
    );


  const strengthB=
    pb.projected
    -
    (
      (recordB-.5)
      *
      1.5
    );


  let winA=
    100
    /
    (
      1+
      Math.exp(
        (
          strengthA
          -
          strengthB
        )
        /
        1.8
      )
    );


  winA=
    Math.max(
      15,
      Math.min(
        85,
        winA
      )
    );


  return{

    scoreA:
      Math.round(
        pa.projected
      ),

    scoreB:
      Math.round(
        pb.projected
      ),

    winA:
      Math.round(
        winA
      ),

    winB:
      100-
      Math.round(
        winA
      )

  };

}


function playoffMatch(a,b){

  if(
    !a
    ||
    !b
  ){

    return '';

  }


  const p=
    predictMatch(
      a,
      b
    );


  const favorite=
    p.winA>p.winB

    ?a.name

    :p.winB>p.winA

    ?b.name

    :'Even';


  return `
    <div class="playoff-card">

      <div class="playoff-row">

        <div>

          <b>
            #${a.seed}
            ${escapeHtml(a.name)}
          </b>

          <div class="muted">
            ${a.w}-${a.l}-${a.t}
            ·
            ${a.pts} pts
          </div>

        </div>

        <div class="playoff-pct">
          ${p.winA}%
        </div>

      </div>


      <div class="playoff-vs">
        VS
      </div>


      <div class="playoff-row">

        <div>

          <b>
            #${b.seed}
            ${escapeHtml(b.name)}
          </b>

          <div class="muted">
            ${b.w}-${b.l}-${b.t}
            ·
            ${b.pts} pts
          </div>

        </div>

        <div class="playoff-pct">
          ${p.winB}%
        </div>

      </div>


      <div
        class="banner"
        style="margin-top:14px">

        <b>
          Projected Score:
        </b>

        ${p.scoreA}
        –
        ${p.scoreB}

        <br>

        <span class="muted">
          Favorite:
          ${escapeHtml(favorite)}
        </span>

      </div>

    </div>
  `;

}
